name: 반덤핑 모니터 자동 갱신

on:
  schedule:
    # 하루 2회 (UTC 기준) — 한국시간 오전 7:17 / 오후 9:47
    #  · 오전: 전날 오후 미국에서 올라온 '게재예정' 공고 확인
    #  · 저녁: 미국 아침 정식 게재분 확인
    - cron: "17 22 * * *"
    - cron: "47 12 * * *"
  workflow_dispatch: {}   # Actions 탭에서 '지금 실행' 버튼

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집 · 사이트 생성 · 알림
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python run_all.py
      - name: 결과 저장
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "자동 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
