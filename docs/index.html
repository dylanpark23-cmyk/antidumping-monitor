asures", "product": "Truck Bed Covers", "countries": ["People's Republic of China"], "stage": "예비판정", "priority": 2, "remedy": "AD", "case_numbers": ["A-570-223"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) preliminarily determines that truck bed covers from the People's Republic of China (China) are being, or are likely to be, sold in the United States at less than fair value (LTFV). The period of investigation is July 1, 2025, through December 31, 2025.", "publication_date": "2026-10-01", "html_url": "https://www.federalregister.gov/documents/2026/10/01/2026-20163/truck-bed-covers-from-the-peoples-republic-of-china-preliminary-affirmative-determination-of-sales", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-01/pdf/2026-20163.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/01/2026-20163.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20162", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Large Diameter Graphite Electrodes From India: Preliminary Affirmative Critical Circumstances Determination in Countervailing Duty Investigation", "product": "Large Diameter Graphite Electrodes", "countries": ["India"], "stage": "기타", "priority": 3, "remedy": "CVD", "case_numbers": ["C-533-949"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) preliminarily determines that critical circumstances exist with respect to imports of large diameter graphite electrodes (large graphite electrodes) from India. The period of investigation is January 1, 2025, through December 31, 2025. Interested parties are invited to comment on this preliminary determination of critical circumstances.", "publication_date": "2026-10-01", "html_url": "https://www.federalregister.gov/documents/2026/10/01/2026-20162/large-diameter-graphite-electrodes-from-india-preliminary-affirmative-critical-circumstances", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-01/pdf/2026-20162.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/01/2026-20162.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20161", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Initiation of Five-Year (Sunset) Reviews", "product": "", "countries": [], "stage": "일몰재심", "priority": 2, "remedy": "AD/CVD", "case_numbers": [], "watch": [], "snippets": [], "abstract": "In accordance with the Tariff Act of 1930, as amended (the Act), the U.S. Department of Commerce (Commerce) is automatically initiating the five-year reviews (Sunset Reviews) of the antidumping duty (AD) and countervailing duty (CVD) orders and suspended investigations listed below. The U.S. International Trade Commission (ITC) is publishing concurrently with this notice its notice of Institution of Five-Year Reviews which covers the same orders and suspended investigations.", "publication_date": "2026-10-01", "html_url": "https://www.federalregister.gov/documents/2026/10/01/2026-20161/initiation-of-five-year-sunset-reviews", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-01/pdf/2026-20161.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/01/2026-20161.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20160", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Initiation of Antidumping and Countervailing Duty Administrative Reviews", "product": "", "countries": [], "stage": "연례재심 개시", "priority": 2, "remedy": "AD/CVD", "case_numbers": [], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) has received requests to conduct administrative reviews of various antidumping duty (AD) and countervailing duty (CVD) orders with August anniversary dates. In accordance with Commerce's regulations, we are initiating those administrative reviews.", "publication_date": "2026-10-01", "html_url": "https://www.federalregister.gov/documents/2026/10/01/2026-20160/initiation-of-antidumping-and-countervailing-duty-administrative-reviews", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-01/pdf/2026-20160.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/01/2026-20160.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20159", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Antidumping or Countervailing Duty Order, Finding, or Suspended Investigation; Advance Notification of Sunset Review", "product": "", "countries": [], "stage": "관세부과 명령", "priority": 2, "remedy": "AD/CVD", "case_numbers": [], "watch": [], "snippets": [], "abstract": "", "publication_date": "2026-10-01", "html_url": "https://www.federalregister.gov/documents/2026/10/01/2026-20159/antidumping-or-countervailing-duty-order-finding-or-suspended-investigation-advance-notification-of", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-01/pdf/2026-20159.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/01/2026-20159.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20139", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Aluminum Foil From Armenia, Brazil, Oman, Russia, and Turkey; Institution of Five-Year Reviews", "product": "Aluminum Foil", "countries": ["Armenia", "Brazil", "Oman", "Russia", "Turkey"], "stage": "일몰재심", "priority": 2, "remedy": "AD/CVD", "case_numbers": ["701-TA-658", "731-TA-1538"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice that it has instituted reviews pursuant to the Tariff Act of 1930, as amended, to determine whether revocation of the countervailing duty orders on imports of aluminum foil from Oman and Turkey and antidumping duty orders on imports of aluminum foil from Armenia, Brazil, Oman, Russia, and Turkey would be likely to lead to continuation or recurrence of material injury. Pursuant to the Act, interested parties are requested to respond to this notice by submitting the information specified below to the Commission.", "publication_date": "2026-10-01", "html_url": "https://www.federalregister.gov/documents/2026/10/01/2026-20139/aluminum-foil-from-armenia-brazil-oman-russia-and-turkey-institution-of-five-year-reviews", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-01/pdf/2026-20139.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/01/2026-20139.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20138", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Alloy Magnesium From China; Institution of a Five-Year Review", "product": "Alloy Magnesium", "countries": ["China"], "stage": "일몰재심", "priority": 2, "remedy": "AD", "case_numbers": ["731-TA-1071"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice that it has instituted a review pursuant to the Tariff Act of 1930, as amended, to determine whether revocation of the antidumping duty order on alloy magnesium from China would be likely to lead to continuation or recurrence of material injury. Pursuant to the Act, interested parties are requested to respond to this notice by submitting the information specified below to the Commission.", "publication_date": "2026-10-01", "html_url": "https://www.federalregister.gov/documents/2026/10/01/2026-20138/alloy-magnesium-from-china-institution-of-a-five-year-review", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-01/pdf/2026-20138.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/01/2026-20138.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20137", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Certain Tissue Paper Products From China; Institution of a Five-Year Review", "product": "Certain Tissue Paper Products", "countries": ["China"], "stage": "일몰재심", "priority": 2, "remedy": "AD", "case_numbers": [], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice that it has instituted a review pursuant to the Tariff Act of 1930, as amended, to determine whether revocation of the antidumping duty order on certain tissue paper products (\"tissue paper\") from China would be likely to lead to continuation or recurrence of material injury. Pursuant to the Act, interested parties are requested to respond to this notice by submitting the information specified below to the Commission.", "publication_date": "2026-10-01", "html_url": "https://www.federalregister.gov/documents/2026/10/01/2026-20137/certain-tissue-paper-products-from-china-institution-of-a-five-year-review", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-01/pdf/2026-20137.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/01/2026-20137.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20136", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Thermal Paper From Germany, Japan, South Korea, and Spain; Institution of Five-Year Reviews", "product": "Thermal Paper", "countries": ["Germany", "Japan", "South Korea", "Spain"], "stage": "일몰재심", "priority": 2, "remedy": "AD", "case_numbers": ["731-TA-1546"], "watch": ["Korea"], "snippets": [], "abstract": "The Commission hereby gives notice that it has instituted reviews pursuant to the Tariff Act of 1930, as amended, to determine whether revocation of the antidumping duty orders on thermal paper from Germany, Japan, South Korea, and Spain would be likely to lead to continuation or recurrence of material injury. Pursuant to the Act, interested parties are requested to respond to this notice by submitting the information specified below to the Commission.", "publication_date": "2026-10-01", "html_url": "https://www.federalregister.gov/documents/2026/10/01/2026-20136/thermal-paper-from-germany-japan-south-korea-and-spain-institution-of-five-year-reviews", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-01/pdf/2026-20136.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/01/2026-20136.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20041", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Cut-to-Length Carbon Steel Plate From Ukraine: Final Results of the Expedited Fifth Sunset Review of the Agreement Suspending the Antidumping Investigation", "product": "Certain Cut-to-Length Carbon Steel Plate", "countries": ["Ukraine"], "stage": "일몰재심", "priority": 2, "remedy": "AD", "case_numbers": ["A-823-808"], "watch": [], "snippets": [], "abstract": "As a result of this sunset review, the U.S. Department of Commerce (Commerce) finds that termination of the Agreement Suspending the Antidumping Investigation of Certain Cut-to-Length Carbon Steel Plate from Ukraine (Agreement) and the suspended antidumping duty investigation would be likely to lead to continuation or recurrence of dumping at the levels indicated in the \"Final Results of Review\" section of this notice.", "publication_date": "2026-09-30", "html_url": "https://www.federalregister.gov/documents/2026/09/30/2026-20041/certain-cut-to-length-carbon-steel-plate-from-ukraine-final-results-of-the-expedited-fifth-sunset", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-30/pdf/2026-20041.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/30/2026-20041.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20031", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Large Diameter Graphite Electrodes From India: Preliminary Affirmative Determination of Sales at Less-Than-Fair-Value, Preliminary Affirmative Determination of Critical Circumstances, Postponement of Final Determination, and Extension of Provisional Measures", "product": "Large Diameter Graphite Electrodes", "countries": ["India"], "stage": "예비판정", "priority": 2, "remedy": "AD", "case_numbers": ["A-533-948"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) preliminarily determines that large diameter graphite electrodes (large graphite electrodes) from India are being, or are likely to be, sold in the United States at less-than-fair-value (LTFV). The period of investigation (POI) is January 1, 2025, through December 31, 2025. Interested parties are invited to comment on this preliminary determination.", "publication_date": "2026-09-30", "html_url": "https://www.federalregister.gov/documents/2026/09/30/2026-20031/large-diameter-graphite-electrodes-from-india-preliminary-affirmative-determination-of-sales-at", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-30/pdf/2026-20031.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/30/2026-20031.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20030", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Large Diameter Graphite Electrodes From the People's Republic of China: Preliminary Affirmative Determination of Sales at Less Than Fair Value and Preliminary Affirmative Determination of Critical Circumstances", "product": "Large Diameter Graphite Electrodes", "countries": ["People's Republic of China"], "stage": "예비판정", "priority": 2, "remedy": "AD", "case_numbers": ["A-570-220"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) preliminarily determines that large diameter graphite electrodes (LDGE) from the People's Republic of China (China) are being, or are likely to be, sold in the United States at less than fair value (LTFV). The period of investigation (POI) is July 1, 2025, through December 31, 2025. Interested parties are invited to comment on this preliminary determination.", "publication_date": "2026-09-30", "html_url": "https://www.federalregister.gov/documents/2026/09/30/2026-20030/large-diameter-graphite-electrodes-from-the-peoples-republic-of-china-preliminary-affirmative", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-30/pdf/2026-20030.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/30/2026-20030.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20024", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Utility Scale Wind Towers From the Republic of Korea: Preliminary Results and Rescission, in Part of Antidumping Duty Administrative Review; 2024-2025", "product": "Utility Scale Wind Towers", "countries": ["Republic of Korea"], "stage": "재심 철회", "priority": 3, "remedy": "AD", "case_numbers": ["A-580-902"], "watch": ["Korea", "사건번호 580"], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) preliminarily determines that Dongkuk S&C Co., Ltd. (Dongkuk) did not make sales of subject merchandise at less than normal value (NV) during the period of review (POR), August 1, 2024, through July 31, 2025. In addition, we are rescinding the review with respect to eight companies. Interested parties are invited to comment on these preliminary results of review.", "publication_date": "2026-09-30", "html_url": "https://www.federalregister.gov/documents/2026/09/30/2026-20024/utility-scale-wind-towers-from-the-republic-of-korea-preliminary-results-and-rescission-in-part-of", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-30/pdf/2026-20024.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/30/2026-20024.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-19932", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Welded Line Pipe From the Republic of Korea: Notice of Court Decision Not in Harmony With the Less-Than-Fair-Value Amended Final Determination; Notice of Amended Final Determination and Notice of Amended Antidumping Duty Order", "product": "Welded Line Pipe", "countries": ["Republic of Korea"], "stage": "최종판정", "priority": 2, "remedy": "AD", "case_numbers": ["A-580-876"], "watch": ["Korea", "사건번호 580"], "snippets": [], "abstract": "On September 15, 2026, the U.S. Court of International Trade (CIT) issued its final judgment in Stupp Corp. v. United States, Court no. 15-00334, sustaining the U.S. Department of Commerce (Commerce)'s fourth final results of redetermination pursuant to remand pertaining to the less-than-fair-value (LTFV) investigation of welded line pipe from the Republic of Korea (Korea) covering the period of investigation October 1, 2013 through September 30, 2014. Commerce is notifying the public that the CIT's final judgment is not in harmony with Commerce's amended final determination in that investigation, and that Commerce is amending the final determination and the resulting antidumping duty order with respect to the estimated weighted-average dumping margin assigned to SeAH Steel Corporation (SeAH) and to all other producers and exporters.", "publication_date": "2026-09-30", "html_url": "https://www.federalregister.gov/documents/2026/09/30/2026-19932/welded-line-pipe-from-the-republic-of-korea-notice-of-court-decision-not-in-harmony-with-the", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-30/pdf/2026-19932.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/30/2026-19932.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-19931", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Passenger Vehicle and Light Truck Tires From the Republic of Korea, Taiwan, and Thailand: Final Results of the Expedited First Sunset Reviews of the Antidumping Duty Orders", "product": "Passenger Vehicle and Light Truck Tires", "countries": ["Republic of Korea", "Taiwan", "Thailand"], "stage": "관세부과 명령", "priority": 2, "remedy": "AD", "case_numbers": ["A-549-842", "A-580-908", "A-583-869"], "watch": ["Korea", "사건번호 580"], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) finds that revocation of the antidumping duty (AD) orders on passenger vehicle and light truck tires (PVLT) from the People's Republic of China (China), Taiwan, and Thailand would be likely to lead to continuation or recurrence of dumping, at the levels indicated in the \"Final Results of Sunset Reviews\" section of this notice.", "publication_date": "2026-09-30", "html_url": "https://www.federalregister.gov/documents/2026/09/30/2026-19931/passenger-vehicle-and-light-truck-tires-from-the-republic-of-korea-taiwan-and-thailand-final-results", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-30/pdf/2026-19931.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/30/2026-19931.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-19930", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Light-Walled Rectangular Pipe and Tube From Mexico: Notice of Court Decision Not in Harmony With the Results of Antidumping Duty Administrative Review; Notice of Amended Final Results", "product": "Light-Walled Rectangular Pipe and Tube", "countries": ["Mexico"], "stage": "기타", "priority": 3, "remedy": "AD", "case_numbers": ["A-201-836"], "watch": [], "snippets": [], "abstract": "On September 14, 2026, the U.S. Court of International Trade (CIT) issued a final judgment in Maquilacero S.A. de C.V. and Tecnicas de Fluidos S.A. de C.V. and Perfiles LM, S.A. de C.V. v. United States, Consol. Court no. 23-00091, sustaining the U.S. Department of Commerce (Commerce)'s second remand results pertaining to the administrative review of the antidumping duty (AD) order on light-walled rectangular pipe and tube (LWRPT) from Mexico covering the period August 1, 2020 through July 31, 2021. Commerce is notifying the public that the CIT's final judgment is not in harmony with Commerce's final results of the administrative review, and that Commerce is amending the final results with respect to the dumping margin assigned to Maquilacero S.A. de C.V. (Maquilacero) and Tecnicas de Fluidos S.A. de C.V. (TEFLU), which were reviewed as a single, individually-examined, collapsed entity, (collectively, Maquilacero/TEFLU). As a result, Commerce is also amending the final results with respect to the dumping margin assigned to the non-selected companies Perfiles L.M., S.A. de C.V. (Perfiles) and Productos Laminados de Monterrey S.A. de C.V. (Productos Laminados).", "publication_date": "2026-09-30", "html_url": "https://www.federalregister.gov/documents/2026/09/30/2026-19930/light-walled-rectangular-pipe-and-tube-from-mexico-notice-of-court-decision-not-in-harmony-with-the", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-30/pdf/2026-19930.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/30/2026-19930.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-19914", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Methionine From France, Japan, and Spain; Notice of Commission Determination To Conduct Full Five-Year Reviews", "product": "Methionine", "countries": ["France", "Japan", "Spain"], "stage": "일몰재심", "priority": 2, "remedy": "AD", "case_numbers": ["731-TA-1534"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice that it will proceed with full reviews pursuant to the Tariff Act of 1930 to determine whether revocation of the antidumping duty orders on methionine from France, Japan, and Spain would be likely to lead to continuation or recurrence of material injury within a reasonably foreseeable time. A schedule for the reviews will be established and announced at a later date.", "publication_date": "2026-09-29", "html_url": "https://www.federalregister.gov/documents/2026/09/29/2026-19914/methionine-from-france-japan-and-spain-notice-of-commission-determination-to-conduct-full-five-year", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-29/pdf/2026-19914.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/29/2026-19914.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-19875", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Wooden Fence Pickets From China; Institution of Antidumping and Countervailing Duty Investigations and Scheduling of Preliminary Phase Investigations", "product": "Wooden Fence Pickets", "countries": ["China"], "stage": "신규 조사 개시(ITC)", "priority": 1, "remedy": "AD/CVD", "case_numbers": ["701-TA-807", "731-TA-1808"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice of the institution of investigations and commencement of preliminary phase antidumping and countervailing duty investigation Nos. 701-TA-807 and 731-TA-1808 (Preliminary) pursuant to the Tariff Act of 1930 to determine whether there is a reasonable indication that an industry in the United States is materially injured or threatened with material injury, or the establishment of an industry in the United States is materially retarded, by reason of imports of wooden fence pickets from China, provided for in subheadings 4404.10.00, 4407.19.00, and 4421.99.70 of the Harmonized Tariff Schedule of the United States, that are alleged to be sold in the United States at less than fair value and alleged to be subsidized by the Government of China. Unless the Department of Commerce (\"Commerce\") extends the time for initiation, the Commission must reach a preliminary determination in antidumping and countervailing duty investigations in 45 days, or in this case by November 9, 2026. The Commission's views must be transmitted to Commerce within five business days thereafter, or by November 17, 2026.", "publication_date": "2026-09-29", "html_url": "https://www.federalregister.gov/documents/2026/09/29/2026-19875/wooden-fence-pickets-from-china-institution-of-antidumping-and-countervailing-duty-investigations", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-29/pdf/2026-19875.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/29/2026-19875.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-19811", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Tin Mill Products From China, Taiwan, and Turkey; Scheduling of the Final Phase of Countervailing Duty and Antidumping Duty Investigations", "product": "Tin Mill Products", "countries": ["China", "Taiwan", "Turkey"], "stage": "일정·청문회", "priority": 3, "remedy": "AD/CVD", "case_numbers": ["701-TA-792", "731-TA-1786"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice of the scheduling of the final phase of antidumping and countervailing duty investigation Nos. 701-TA-792 and 731-TA-1786-1788 (Final) pursuant to the Tariff Act of 1930 to determine whether an industry in the United States is materially injured or threatened with material injury, or the establishment of an industry in the United States is materially retarded, by reason of imports of tin mill products from China, Taiwan, and Turkey, provided for in subheadings 7210.11.00, 7210.12.00, 7210.50.00, 7212.10.00, 7212.50.00, if of non-alloy steel and under HTSUS subheadings 7225.99.00, and 7226.99.01 of the Harmonized Tariff Schedule of the United States, preliminarily determined by the Department of Commerce (\"Commerce\") to be subsidized and sold at less-than-fair-value. Commerce's preliminary determinations with respect to tin mill products from Taiwan and Turkey, alleged to be sold in the United States at less-than-fair- value, are pending.", "publication_date": "2026-09-28", "html_url": "https://www.federalregister.gov/documents/2026/09/28/2026-19811/tin-mill-products-from-china-taiwan-and-turkey-scheduling-of-the-final-phase-of-countervailing-duty", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-28/pdf/2026-19811.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/28/2026-19811.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-19779", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Frozen Warmwater Shrimp From India: Rescission of Antidumping Duty Administrative Review, In Part; 2025-2026", "product": "Certain Frozen Warmwater Shrimp", "countries": ["India"], "stage": "재심 철회", "priority": 3, "remedy": "AD", "case_numbers": ["A-533-840"], "watch": [], "snippets": [], "abstract": "On March 31, 2026, the U.S. Department of Commerce (Commerce) initiated an administrative review of the antidumping duty (AD) order on certain frozen warmwater shrimp (shrimp) from India for the period of review (POR) February 1, 2025, through January 31, 2026, for 393 companies. We are rescinding this administrative review with respect to certain companies because they had no reviewable entries of subject merchandise during the POR. For a list of the companies for which we are rescinding this review in the absence of suspended entries of subject merchandise during the POR, see Appendix I to this notice. For a list of the companies for which the review is continuing, see Appendix II to this notice.", "publication_date": "2026-09-28", "html_url": "https://www.federalregister.gov/documents/2026/09/28/2026-19779/certain-frozen-warmwater-shrimp-from-india-rescission-of-antidumping-duty-administr epublic of China (China) or the Socialist Republic of Vietnam (Vietnam), are circumventing the antidumping duty (AD) order on hangers from China, or the AD and countervailing duty (CVD) orders on hangers from Vietnam. Interested parties are invited to comment on this preliminary determination.", "publication_date": "2026-09-22", "html_url": "https://www.federalregister.gov/documents/2026/09/22/2026-19376/steel-wire-garment-hangers-from-the-peoples-republic-of-china-and-the-socialist-republic-of-vietnam", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-22/pdf/2026-19376.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/22/2026-19376.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-19375", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Polyethylene Terephthalate Resin From the Sultanate of Oman: Amended Final Results of Antidumping Duty Administrative Review; 2023-2024; Correction", "product": "Polyethylene Terephthalate Resin", "countries": ["Sultanate of Oman"], "stage": "연례재심 최종결과", "priority": 2, "remedy": "AD", "case_numbers": ["A-523-810"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) published a notice in the Federal Register of September 2026, in which Commerce amended the final results of the 2023-2024 administrative review of the antidumping duty (AD) order on polyethylene terephthalate resin (PET resin) from the Sultanate of Oman (Oman) to correct a ministerial error. In that notice, Commerce identified an incorrect effective date for the amended final cash deposit requirements.", "publication_date": "2026-09-22", "html_url": "https://www.federalregister.gov/documents/2026/09/22/2026-19375/polyethylene-terephthalate-resin-from-the-sultanate-of-oman-amended-final-results-of-antidumping", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-22/pdf/2026-19375.pdf", "raw_text_url": "https://www.fe medy": "AD/CVD", "case_numbers": ["A-570-174", "C-570-175"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) preliminarily determines that imports of compacted graphite iron (CGI) brake drums, from the People's Republic of China (China), constitute later-developed merchandise that is circumventing the antidumping duty (AD) and countervailing duty (CVD) orders on certain brake drums (brake drums) from China. Interested parties are invited to comment on this preliminary determination.", "publication_date": "2026-09-22", "html_url": "https://www.federalregister.gov/documents/2026/09/22/2026-19372/certain-brake-drums-from-the-peoples-republic-of-china-preliminary-affirmative-determination-of", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-22/pdf/2026-19372.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/22/2026-19372.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-19274", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Tin Mill Products From the People's Republic of China: Preliminary Affirmative Determination of Sales at Less Than Fair Value, Preliminary Affirmative Determination of Critical Circumstances and Extension of Provisional Measures", "product": "Tin Mill Products", "countries": ["People's Republic of China"], "stage": "예비판정", "priority": 2, "remedy": "AD", "case_numbers": ["A-570-228"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) preliminarily determines that tin mill products from the People's Republic of China (China) are being, or are likely to be, sold in the United States at less than fair value (LTFV). The period of investigation (POI) is October 1, 2025, through March 31, 2026. Interested parties are invited to comment on this preliminary determination.", "publication_date": "2026-09-21", "html_url": "https://www.federalregister.gov/documents/2026/09/2 ding, or Suspended Investigation; Advance Notification of Sunset Review", "product": "", "countries": [], "stage": "관세부과 명령", "priority": 2, "remedy": "AD/CVD", "case_numbers": [], "watch": [], "snippets": [], "abstract": "", "publication_date": "2026-09-01", "html_url": "https://www.federalregister.gov/documents/2026/09/01/2026-17809/antidumping-or-countervailing-duty-order-finding-or-suspended-investigation-advance-notification-of", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-01/pdf/2026-17809.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/01/2026-17809.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-17796", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Alkyl Phosphate Esters From the People's Republic of China: Initiation of Circumvention Inquiry on the Antidumping and Countervailing Duty Orders", "product": "Certain Alkyl Phosphate Esters", "countries": ["People's Republic of China"], "stage": "관세부과 명령", "priority": 2, "remedy": "AD/CVD", "case_numbers": ["A-570-168", "C-570-169"], "watch": [], "snippets": [], "abstract": "In response to a request from ICL-IP America, Inc. (the requestor), the U.S. Department of Commerce (Commerce) is initiating a country-wide circumvention inquiry to determine whether certain alkyl phosphate esters (esters), which are completed or assembled in Thailand with intermediate chemicals produced in the People's Republic of China (China), are circumventing the antidumping duty (AD) and countervailing duty (CVD) orders on esters from China.", "publication_date": "2026-09-01", "html_url": "https://www.federalregister.gov/documents/2026/09/01/2026-17796/certain-alkyl-phosphate-esters-from-the-peoples-republic-of-china-initiation-of-circumvention", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-01/pdf/2026-17796.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/01/2026-17796.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-17795", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Alkyl Phosphate Esters From the People's Republic of China: Initiation of Circumvention Inquiry on the Antidumping and Countervailing Duty Orders", "product": "Certain Alkyl Phosphate Esters", "countries": ["People's Republic of China"], "stage": "관세부과 명령", "priority": 2, "remedy": "AD/CVD", "case_numbers": ["A-570-168", "C-570-169"], "watch": [], "snippets": [], "abstract": "In response to a request from ICL-IP America, Inc. (the requester), the U.S. Department of Commerce (Commerce) is initiating a country-wide circumvention inquiry to determine whether spray-foam systems from Thailand, which are completed or assembled with components produced in the People's Republic of China (China), are circumventing the antidumping duty (AD) and countervailing duty (CVD) orders on certain alkyl phosphate esters (esters) from China.", "publication_date": "2026-09-01", "html_url": "https://www.federalregister.gov/documents/2026/09/01/2026-17795/certain-alkyl-phosphate-esters-from-the-peoples-republic-of-china-initiation-of-circumvention", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-01/pdf/2026-17795.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/01/2026-17795.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-17794", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Choline Salts From the People's Republic of China: Postponement of Preliminary Determination in the Countervailing Duty Investigation", "product": "Certain Choline Salts", "countries": ["People's Republic of China"], "stage": "예비판정", "priority": 2, "remedy": "CVD", "case_numbers": ["C-570-239"], "watch": [], "snippets": [], "abstract": "", "publication_date": "2026-09-01", "html_url": "https://www.federalregister.gov/documents/2026/09/01/2026-17794/certain-choline-salts-from-the-peoples-republic-of-china-postponement-of-preliminary-determination", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-01/pdf/2026-17794.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/01/2026-17794.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-17772", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Light-Walled Rectangular Pipe and Tube From the People's Republic of China, Mexico, the Republic of Korea, and the Republic of Türkiye: Continuation of Antidumping Duty Orders and Countervailing Duty Order", "product": "Light-Walled Rectangular Pipe and Tube", "countries": ["People's Republic of China", "Mexico", "Republic of Korea", "Republic of Türkiye"], "stage": "관세부과 명령", "priority": 2, "remedy": "AD/CVD", "case_numbers": ["A-201-836", "A-489-815", "A-570-914", "A-580-859", "C-570-915"], "watch": ["Korea", "사건번호 580"], "snippets": [], "abstract": "As a result of the determinations by the U.S. Department of Commerce (Commerce) and the U.S. International Trade Commission (ITC) that revocation of the antidumping duty (AD) orders and countervailing duty (CVD) order on light-walled rectangular pipe and tube (light- walled pipe and tube) from the People's Republic of China (China) (AD/ CVD), Mexico (AD), the Republic of Korea (Korea) (AD) and the Republic of T[uuml]rkiye (T[uuml]rkiye) (AD) would likely lead to the continuation or recurrence of dumping, countervailable subsidies, and material injury to an industry in the United States, Commerce is publishing a notice of continuation of these AD and CVD orders.", "publication_date": "2026-09-01", "html_url": "https://www.federalregister.gov/documents/2026/09/01/2026-17772/light-walled-rectangular-pipe-and-tube-from-the-peoples-republic-of-china-mexico-the-republic-of", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-01/pdf/2026-17772.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/01/2026-17772.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-17771", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Circular Welded Carbon Steel Pipes and Tubes From Thailand: Final Results of Antidumping Duty Administrative Review; 2024-2025", "product": "Circular Welded Carbon Steel Pipes and Tubes", "countries": ["Thailand"], "stage": "연례재심 최종결과", "priority": 2, "remedy": "AD", "case_numbers": ["A-549-502"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) determines that producers and exporters subject to this administrative review did not make sales of subject merchandise at prices below normal value (NV) the period of review (POR) March 1, 2024, through February 28, 2025.", "publication_date": "2026-09-01", "html_url": "https://www.federalregister.gov/documents/2026/09/01/2026-17771/circular-welded-carbon-steel-pipes-and-tubes-from-thailand-final-results-of-antidumping-duty", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-01/pdf/2026-17771.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/01/2026-17771.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-17770", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Pure Magnesium From the People's Republic of China: Notice of Court Decision Not in Harmony With the Final Results Antidumping Review; Notice of Amended Final Results", "product": "Pure Magnesium", "countries": ["People's Republic of China"], "stage": "기타", "priority": 3, "remedy": "AD", "case_numbers": ["A-570-832"], "watch": [], "snippets": [], "abstract": "On August 14, 2026, the U.S. Court of International Trade (the Court or CIT) issued its final judgment in Tianjin Magnesium International Co., Ltd., et al., v. United States, Court no. 25-00002, sustaining the U.S. Department of Commerce (Commerce)'s amended final remand redetermination concerning the electricity surrogate value selection covering the period May 1, 2022, through April 30, 2023, of the antidumping duty (AD) order on pure magnesium from China. Commerce is notifying the public that the CIT's final judgment is not in harmony with Commerce's final results in this AD review and is amending its final results with respect to the dumping margin assigned to Tianjin Magnesium International Co., Ltd.; Tianjin Magnesium Metal Co., Ltd. (collectively, MMC), the sole respondent individually examined in the underlying review.", "publication_date": "2026-09-01", "html_url": "https://www.federalregister.gov/documents/2026/09/01/2026-17770/pure-magnesium-from-the-peoples-republic-of-china-notice-of-court-decision-not-in-harmony-with-the", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-01/pdf/2026-17770.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/01/2026-17770.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-17769", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Ammonium Sulfate From People's Republic of China: Notice of Court Decision Not in Harmony With Final Scope Ruling and Notice of Amended Final Scope Ruling Pursuant to Court Decision", "product": "Ammonium Sulfate", "countries": ["People's Republic of China"], "stage": "범위 판정", "priority": 3, "remedy": "AD/CVD", "case_numbers": ["A-570-049", "C-570-050"], "watch": [], "snippets": [], "abstract": "On August 12, 2026, the U.S. Court of International Trade (CIT or the Court) issued its final judgment in Cambridge Isotope Laboratories, Inc. v. United States, Court No. 23-00080 sustaining the U.S. Department of Commerce (Commerce)'s remand redetermination pertaining to the scope ruling for the antidumping and countervailing duty orders on Ammonium Sulfate from People's Republic of China finding enriched \\15\\N ammonium sulfate isotope to be included in the orders. Commerce is notifying the public that the CIT's final judgment is not in harmony with Commerce's scope ruling, and that Commerce is amending the scope ruling to find that enriched \\15\\N ammonium sulfate isotope is outside the scope of the orders.", "publication_date": "2026-09-01", "html_url": "https://www.federalregister.gov/documents/2026/09/01/2026-17769/ammonium-sulfate-from-peoples-republic-of-china-notice-of-court-decision-not-in-harmony-with-final", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-01/pdf/2026-17769.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/01/2026-17769.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-17768", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Cold-Rolled Steel Flat Products From the Republic of Korea: Final Results of Countervailing Duty Administrative Review; 2023", "product": "Certain Cold-Rolled Steel Flat Products", "countries": ["Republic of Korea"], "stage": "연례재심 최종결과", "priority": 2, "remedy": "CVD", "case_numbers": ["C-580-882"], "watch": ["Korea", "사건번호 580"], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) determines Hyundai Steel Company (Hyundai Steel) and POSCO, producers/exporters of certain cold-rolled steel flat products (cold-rolled steel) from the Republic of Korea (Korea), received countervailable subsidies during the period of review (POR) January 1, 2023, through December 31, 2023.", "publication_date": "2026-09-01", "html_url": "https://www.federalregister.gov/documents/2026/09/01/2026-17768/certain-cold-rolled-steel-flat-products-from-the-republic-of-korea-final-results-of-countervailing", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-09-01/pdf/2026-17768.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/09/01/2026-17768.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-17750", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Van-Type Trailers and Subassemblies Thereof From the People's Republic of China: Final Affirmative Determination of Sales at Less Than Fair Value", "product": "Van-Type Trailers and Subassemblies Thereof", "countries": ["People's Republic of China"], "stage": "최종판정", "priority": 2, "remedy": "AD", "case_numbers": ["A-570-219"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) determines that van-type trailers and subassemblies thereof (van-type trailers) from the People's Republic of China (China) are being, or are likely to be, sold in the United States at less than fair value (LTFV) for the period of investigation (POI) April 1, 2025, through September 30, 2025.", "publication_date": "2026-08-31", "html_url": "https://www.federalregister.gov/documents/2026/08/31/2026-17750/van-type-trailers-and-subassemblies-thereof-from-the-peoples-republic-of-china-final-affirmative", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-31/pdf/2026-17750.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/31/2026-17750.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-17749", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Van-Type Trailers and Subassemblies Thereof From the People's Republic of China: Final Affirmative Countervailing Duty Determination", "product": "Van-Type Trailers and Subassemblies Thereof", "countries": ["People's Republic of China"], "stage": "기타", "priority": 3, "remedy": "CVD", "case_numbers": ["C-570-218"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) determines that countervailable subsidies are being provided to producers and exporters of van-type trailers and subassemblies thereof (van-type trailers) from the People's Republic of China (China). The period of investigation is January 1, 2024, through December 31, 2024.", "publication_date": "2026-08-31", "html_url": "https://www.federalregister.gov/documents/2026/08/31/2026-17749/van-type-trailers-and-subassemblies-thereof-from-the-peoples-republic-of-china-final-affirmative", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-31/pdf/2026-17749.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/31/2026-17749.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-17735", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Circular Welded Carbon-Quality Steel Pipe From the United Arab Emirates: Notice of Court Decision Not in Harmony With the Results of Antidumping Administrative Review; Notice of Amended Final Results", "product": "Circular Welded Carbon-Quality Steel Pipe", "countries": ["United Arab Emirates"], "stage": "기타", "priority": 3, "remedy": "AD", "case_numbers": ["A-520-807"], "watch": [], "snippets": [], "abstract": "On August 19, 2026, the U.S. Court of International Trade (CIT) issued its final judgment in Universal Tube & Plastic Indus., Ltd. v. United States, Court No. 23-00113, sustaining the U.S. Department of Commerce (Commerce)'s second remand results pertaining to the administrative review of the antidumping duty (AD) order on circular welded carbon-quality steel pipe (CWP) from the United Arab Emirates (UAE) covering the period December 1, 2020, through November 30, 2021. Commerce is notifying the public that the CIT's final judgment is not in harmony with Commerce's final results of the administrative review, and that Commerce is amending the final results with respect to the dumping margin assigned to Universal Tube and Plastic Industries, Ltd.; THL Tube and Pipe Industries LLC; and KHK Scaffolding and Formwork LLC (collectively, Univ -Weld Pipe Fittings", "countries": ["People's Republic of China"], "stage": "기타", "priority": 3, "remedy": "AD", "case_numbers": ["A-570-814"], "watch": [], "snippets": [], "abstract": "On July 29, 2026, the U.S. Court of International Trade (CIT) issued its final judgment in Tube Forgings of America, Inc. and Mills Iron Works, Inc. v. United States, Consol. Court No. 23-00231, sustaining the U.S. Department of Commerce (Commerce)'s second remand redetermination pertaining to the covered merchandise inquiry (CMI) for the antidumping duty (AD) order on certain carbon steel butt-weld pipe fittings (butt-weld pipe fittings) from the People's Republic of China (China). Commerce is notifying the public that the CIT's final judgment is not in harmony with Commerce's CMI determination, and that Commerce is amending the CMI determination to find that products cut to length and formed into the rough shape of a butt-weld pipe fitting in China represent \"unfinished\" fittings, which are covered by the scope of the Order, and that when such products are further processed in the Socialist Republic of Vietnam (Vietnam), they remain subject to the AD order on butt-weld pipe fittings from China.", "publication_date": "2026-08-28", "html_url": "https://www.federalregister.gov/documents/2026/08/28/2026-17621/certain-carbon-steel-butt-weld-pipe-fittings-from-the-peoples-republic-of-china-notice-of-court", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-28/pdf/2026-17621.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/28/2026-17621.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-17620", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Hardwood Plywood Products From the People's Republic of China: Final Determinations of No Shipments in the Antidumping and Countervailing Duty Administrative Reviews; 2024, 2020-2021", "product": "Certain Hardwood Plywood Prod ntervailing Duty Order", "product": "Certain Large Vertical Shaft Engines Between 225cc and 999cc, and Parts Thereof", "countries": ["People's Republic of China"], "stage": "관세부과 명령", "priority": 2, "remedy": "AD/CVD", "case_numbers": ["A-570-119", "C-570-120"], "watch": [], "snippets": [], "abstract": "As a result of the determinations by the U.S. Department of Commerce (Commerce) and the U.S. International Trade Commission (ITC) that revocation of the antidumping duty (AD) order and countervailing duty (CVD) order on certain large vertical shaft engines between 225cc and 999cc, and parts thereof (vertical shaft engines) from the People's Republic of China (China) would likely lead to the continuation or recurrence of dumping, countervailable subsidies, and material injury to an industry in the United States, Commerce is publishing a notice of continuation of these AD and CVD orders.", "publication_date": "2026-08-20", "html_url": "https://www.federalregister.gov/documents/2026/08/20/2026-17031/certain-large-vertical-shaft-engines-between-225cc-and-999cc-and-parts-thereof-from-the-peoples", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-20/pdf/2026-17031.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/20/2026-17031.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-16881", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Phosphate Fertilizers From the Russian Federation: Notice of Court Decision Not in Harmony With the Results of Countervailing Duty Administrative Review; Notice of Amended Final Results", "product": "Phosphate Fertilizers", "countries": ["Russian Federation"], "stage": "기타", "priority": 3, "remedy": "CVD", "case_numbers": ["C-821-825"], "watch": [], "snippets": [], "abstract": "On August 12, 2026, the U.S. Court of International Trade (CIT) issued its final judgment in Archer Daniels Midland Co v. United States, Consol. Court no. urce": "US-FR", "status": "게재", "agency": "ITC", "title": "Carbazole Violet Pigment 23 From China and India; Termination of Five-Year Reviews", "product": "Carbazole Violet Pigment 23", "countries": ["China", "India"], "stage": "일몰재심", "priority": 2, "remedy": "AD/CVD", "case_numbers": ["701-TA-437", "731-TA-1060"], "watch": [], "snippets": [], "abstract": "The Commission instituted the subject five-year reviews on May 1, 2026 to determine whether revocation of the countervailing duty order on carbazole violet pigment 23 from India and the antidumping duty orders on carbazole violet pigment 23 from China and India would be likely to lead to continuation or recurrence of material injury. On August 7, 2026, the Department of Commerce published notice in the Federal Register that it was revoking the orders applicable August 7, 2026, because no domestic interested party filed a timely notice of intent to participate. Accordingly, the subject reviews are terminated.", "publication_date": "2026-08-14", "html_url": "https://www.federalregister.gov/documents/2026/08/14/2026-16581/carbazole-violet-pigment-23-from-china-and-india-termination-of-five-year-reviews", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-14/pdf/2026-16581.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/14/2026-16581.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-16553", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Frozen Fish Fillets From the Socialist Republic of Vietnam: Final Results and Rescission, in Part, of Antidumping Duty Administrative Review; 2023-2024", "product": "Certain Frozen Fish Fillets", "countries": ["Socialist Republic of Vietnam"], "stage": "재심 철회", "priority": 3, "remedy": "AD", "case_numbers": ["A-552-801"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) determines that Bien Dong Seafood Co., Ltd. (Bien Dong) ", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Carbon and Alloy Steel Wire Rod From the Republic of Korea: Preliminary Results of Antidumping Duty Administrative Review; 2024-2025", "product": "Carbon and Alloy Steel Wire Rod", "countries": ["Republic of Korea"], "stage": "연례재심 예비결과", "priority": 2, "remedy": "AD", "case_numbers": ["A-580-891"], "watch": ["Korea", "사건번호 580"], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) preliminarily finds that POSCO and POSCO International Corporation (PIC) (collectively, POSCO), a producer and exporter of carbon and alloy steel wire rod (wire rod) from the Republic of Korea (Korea), did not sell subject merchandise in the United States at prices below normal value during the period of review (POR) May 1, 2024, through April 30, 2025. We invite all interested parties to comment on these preliminary results.", "publication_date": "2026-08-13", "html_url": "https://www.federalregister.gov/documents/2026/08/13/2026-16548/carbon-and-alloy-steel-wire-rod-from-the-republic-of-korea-preliminary-results-of-antidumping-duty", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-13/pdf/2026-16548.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/13/2026-16548.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-16547", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Utility Scale Wind Towers From Indonesia: Final Results of Antidumping Duty Administrative Review; 2023-2024", "product": "Utility Scale Wind Towers", "countries": ["Indonesia"], "stage": "연례재심 최종결과", "priority": 2, "remedy": "AD", "case_numbers": ["A-560-833"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) determines that utility scale wind towers (wind towers) from Indonesia are not being sold in the United States at less than normal value during the period of review (POR), August June anniversary dates. In accordance with Commerce's regulations, we are initiating those administrative reviews.", "publication_date": "2026-08-10", "html_url": "https://www.federalregister.gov/documents/2026/08/10/2026-16265/initiation-of-antidumping-and-countervailing-duty-administrative-reviews", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-10/pdf/2026-16265.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/10/2026-16265.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-16203", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Perfluoroalkoxy Alkane From India; Institution of Antidumping and Countervailing Duty Investigations and Scheduling of Preliminary Phase Investigations", "product": "Perfluoroalkoxy Alkane", "countries": ["India"], "stage": "신규 조사 개시(ITC)", "priority": 1, "remedy": "AD/CVD", "case_numbers": ["701-TA-805", "731-TA-1804"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice of the institution of investigations and commencement of preliminary phase antidumping and countervailing duty investigation Nos. 701-TA-805 and 731-TA-1804 (Preliminary) pursuant to the Tariff Act of 1930 to determine whether there is a reasonable indication that an industry in the United States is materially injured or threatened with material injury, or the establishment of an industry in the United States is materially retarded, by reason of imports of perfluoroalkoxy alkane from India, provided for in subheading 3904.69.50 of the Harmonized Tariff Schedule of the United States, that are alleged to be sold in the United States at less than fair value and alleged to be subsidized by the Government of India. Unless the Department of Commerce (\"Commerce\") extends the time for initiation, the Commission must reach a preliminary determination in antidumping and countervailing duty investigations in 45 days, or in this case by September 21, 2026. The Commission's views must be transmitted to Commerce within five business days thereafter, or by September 28, 2026.", "publication_date": "2026-08-10", "html_url": "https://www.federalregister.gov/documents/2026/08/10/2026-16203/perfluoroalkoxy-alkane-from-india-institution-of-antidumping-and-countervailing-duty-investigations", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-10/pdf/2026-16203.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/10/2026-16203.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-16195", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Truck Bed Covers From China; Scheduling of the Final Phase of Countervailing Duty and Antidumping Duty Investigations", "product": "Truck Bed Covers", "countries": ["China"], "stage": "일정·청문회", "priority": 3, "remedy": "AD/CVD", "case_numbers": ["701-TA-789", "731-TA-1777"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice of the scheduling of the final phase of antidumping and countervailing duty investigation Nos. 701-TA-789 and 731-TA-1777 (Final) pursuant to the Tariff Act of 1930 to determine whether an industry in the United States is materially injured or threatened with material injury, or the establishment of an industry in the United States is materially retarded, by reason of imports of truck bed covers from China, provided for in subheading 8708.29.51 of the Harmonized Tariff Schedule of the United States, preliminarily determined by the Department of Commerce (\"Commerce\") to be subsidized by the government of China. Commerce's preliminary determinations with respect to truck bed covers from China, alleged to be sold in the United States at less-than-fair-value, are pending.", "publication_date": "2026-08-10", "html_url": "https://www.federalregister.gov/documents/2026/08/10/2026-16195/truck-bed-covers-from-china-scheduling-of-the-final-pha -533-838", "A-570-892"], "watch": [], "snippets": [], "abstract": "On May 1, 2026, the Department of Commerce (Commerce) initiated the fourth sunset reviews of the antidumping duty (AD) orders on carbazole violet pigment 23 (CVP-23) From India and the People's Republic of China (China). Because no domestic interested party responded to the sunset review notice of initiation by the applicable deadline, consistent with section 751(c)(3)(A) of the Tariff Act of 1930, as amended (the Act), Commerce is revoking the AD orders on CVP- 23 from India and China.", "publication_date": "2026-08-07", "html_url": "https://www.federalregister.gov/documents/2026/08/07/2026-16143/carbazole-violet-pigment-23-from-india-and-the-peoples-republic-of-china-final-results-of-sunset", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-07/pdf/2026-16143.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/07/2026-16143.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-16057", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Prestressed Concrete Steel Wire Strand From the People's Republic of China: Final Results of the Expedited Third Sunset Review of the Antidumping Duty Order", "product": "Prestressed Concrete Steel Wire Strand", "countries": ["People's Republic of China"], "stage": "관세부과 명령", "priority": 2, "remedy": "AD", "case_numbers": ["A-570-945"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) finds that revocation of the antidumping duty (AD) order on prestressed concrete steel wire strand (PC strand) from the People's Republic of China (China) would be likely to lead to continuation or recurrence of dumping, at the levels indicated in the \"Final Results of Sunset Review\" section of this notice.", "publication_date": "2026-08-06", "html_url": "https://www.federalregister.gov/documents/2026/08/06/2026-16057/prestressed-concrete-steel-wire-strand-from-the-peoples-republic-of-china-final-results-of-the", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-06/pdf/2026-16057.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/06/2026-16057.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-16056", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Tissue Paper Products From the People's Republic of China: Initiation of Circumvention Inquiry of the Antidumping Duty Order", "product": "Certain Tissue Paper Products", "countries": ["People's Republic of China"], "stage": "관세부과 명령", "priority": 2, "remedy": "AD", "case_numbers": ["A-570-894"], "watch": [], "snippets": [], "abstract": "In response to a request from Seaman Paper Company of Massachusetts, Inc. (Seaman, or the requester), the U.S. Department of Commerce (Commerce) is initiating a country-wide circumvention inquiry to determine whether imports of certain tissue paper products (tissue paper) completed in the Socialist Republic of Vietnam (Vietnam) using jumbo paper rolls manufactured in the People's Republic of China (China), are circumventing the antidumping duty (AD) order on tissue paper from China.", "publication_date": "2026-08-06", "html_url": "https://www.federalregister.gov/documents/2026/08/06/2026-16056/certain-tissue-paper-products-from-the-peoples-republic-of-china-initiation-of-circumvention-inquiry", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-06/pdf/2026-16056.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/06/2026-16056.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-16053", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Disposable Aluminum Containers, Pans, Trays, and Lids From the People's Republic of China: Initiation of Circumvention Inquiries on the Antidumping and Countervailing Duty Orders", "product": "Disposable Aluminum Containers, Pans, Trays, and Lids", "countries": ["People's Republic of China"], "stage": "관세부과 명령", "priority": 2, "remedy": "AD/CVD", "case_numbers": ["A-570-170", "C-570-171"], "watch": [], "snippets": [], "abstract": "In response to a request from the Aluminum Foil Containers Manufacturers Association (AFCMA) and the following individual members of AFCMA, Durable Packaging International; D&W Fine Pack, LLC; Handifoil Corp.; Penny Plate, LLC; Reynolds Consumer Products, LLC; Shah Foil Products, Inc.; Smart USA, Inc.; Trinidad/Benham Corp.; and Wyda Packaging Corp. (collectively, the requesters), the U.S. Department of Commerce (Commerce) is initiating country-wide circumvention inquiries to determine whether imports of disposable aluminum containers, pans, trays, and lids (aluminum containers) completed in Indonesia and Malaysia (collectively, the third countries) using aluminum foil manufactured in the People's Republic of China (China), are circumventing the antidumping duty (AD) and countervailing duty (CVD) orders on aluminum containers from China.", "publication_date": "2026-08-06", "html_url": "https://www.federalregister.gov/documents/2026/08/06/2026-16053/disposable-aluminum-containers-pans-trays-and-lids-from-the-peoples-republic-of-china-initiation-of", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-06/pdf/2026-16053.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/06/2026-16053.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-16052", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Corrosion Inhibitors From the People's Republic of China: Continuation of Antidumping Duty and Countervailing Duty Orders", "product": "Certain Corrosion Inhibitors", "countries": ["People's Republic of China"], "stage": "관세부과 명령", "priority": 2, "remedy": "AD/CVD", "case_numbers": ["A-570-122", "C-570-123"], "watch": [], "snippets": [], "abstract": "As a result of the determinations by the U.S. Department of Commerce (Commerce) and the U.S. International Trade Commission (ITC) that revocation of the antidumping duty (AD) order and countervailing duty (CVD) order on certain corrosion inhibitors from the People's Republic of China would likely lead to the continuation or recurrence of dumping, countervailable subsidies, and material injury to an industry in the United States, Commerce is publishing a notice of continuation of these AD and CVD orders.", "publication_date": "2026-08-06", "html_url": "https://www.federalregister.gov/documents/2026/08/06/2026-16052/certain-corrosion-inhibitors-from-the-peoples-republic-of-china-continuation-of-antidumping-duty-and", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-06/pdf/2026-16052.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/06/2026-16052.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-16051", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Magnesia Carbon Bricks From the People's Republic of China: Rescission of Antidumping Duty Administrative Review; 2024-2025", "product": "Certain Magnesia Carbon Bricks", "countries": ["People's Republic of China"], "stage": "재심 철회", "priority": 3, "remedy": "AD", "case_numbers": ["A-570-954"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) is rescinding the administrative review of the antidumping duty (AD) order on certain magnesia carbon bricks (bricks) from the People's Republic of China (China) covering the period of review (POR) September 1, 2024, through August 31, 2025, because, as explained below, there are no reviewable suspended entries for the companies subject to this review.", "publication_date": "2026-08-06", "html_url": "https://www.federalregister.gov/documents/2026/08/06/2026-16051/certain-magnes
