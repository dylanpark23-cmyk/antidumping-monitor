<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AD Monitor 무역구제</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 국제통상 컨설팅 회사 홈페이지 — 단정하고 신뢰감 있게
   IDEA: THE ITC 사이트의 주황 띠·좌측 메뉴 구조 + 날짜 눈금자에 공고가 바늘처럼 꽂히는 계기판
   PICTURE: 메인 주황 패널 위 60일 눈금자 (한국 관련 공고 = 흰 바늘)
   COLOUR and TYPE: 흰 바탕, 주황 #f26b1d, 짙은 회색 글자 / 로고 Cinzel, 본문 Noto Sans KR
   LAYOUT: 상단 유틸+로고+7메뉴 → 주황 띠 → 메인(눈금자 패널 | NOTICE) → 6개 분야 타일 → 주황 수치 띠 → 공고 목록 */
:root{color-scheme:light dark;--bg:light-dark(#fff,#16171a);--soft:light-dark(#f4f4f4,#1f2024);--ink:light-dark(#222,#ececec);--mute:light-dark(#6b6b6b,#a3a3a3);--line:light-dark(#dedede,#34363b);--or:#f26b1d;--or2:#e05a0c;--orl:light-dark(#fff3ea,#2a1d14)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(3vw,16px)}
.fig{position:relative;min-height:170px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.scroll{overflow-x:auto}
/* header */
.util{display:flex;justify-content:flex-end;gap:18px;font-size:13px;color:var(--mute);padding-top:10px}
.util a{text-decoration:none}.util a:hover{color:var(--or)}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:6px 0 14px;flex-wrap:wrap}
.logo{text-decoration:none;display:block;line-height:1}
.logo b{font:600 clamp(30px,3.6vw,42px)/1 Cinzel,serif;color:var(--or);letter-spacing:.02em;display:block}
.logo small{display:block;font-size:13px;color:var(--mute);margin-top:6px;letter-spacing:.02em}
nav.gnb{display:flex;gap:4px;flex-wrap:wrap}
nav.gnb a{flex:none;font-size:16px;font-weight:700;text-decoration:none;padding:10px 12px;min-height:44px;display:flex;align-items:center;border-bottom:3px solid transparent;white-space:nowrap}
nav.gnb a:hover{color:var(--or)}
nav.gnb a.on{color:var(--or);border-bottom-color:var(--or)}
nav.gnb a.data{margin-left:8px;border-left:1px solid var(--line);padding-left:18px}
.band{height:14px;background:linear-gradient(90deg,var(--or2),var(--or) 60%,#ff8a3d)}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0;margin-top:24px;border:1px solid var(--line)}
.hp{background:linear-gradient(135deg,#e05a0c,#f26b1d 55%,#ff9152);color:#fff;padding:clamp(22px,3vw,40px);display:flex;flex-direction:column}.hp .fig{flex:1;min-height:190px}
.hp .eyebrow{font-size:15px;opacity:.9;margin:0}
.hp h1{font-size:clamp(28px,3.6vw,44px);line-height:1.15;margin:6px 0 8px;font-weight:700;text-wrap:balance}
.hp p.s{margin:0 0 10px;opacity:.92;font-size:15px}
.notice{background:var(--bg);padding:22px 22px 16px}
.nt{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
.nt b{font-size:18px}.nt a{font-size:13px;color:var(--mute);text-decoration:none}.nt a:hover{color:var(--or)}
.notice ul{list-style:none;margin:0;padding:0}
.notice li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.notice li a{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.notice li a:hover{color:var(--or)}
.notice time{color:var(--mute);font-size:13px;white-space:nowrap}
.notice .em{color:var(--mute);font-size:14px;padding:12px 0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);margin-top:28px}
.tile{display:block;text-decoration:none;padding:18px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:120px}
.tile:hover{background:var(--orl)}
.tile h3{margin:0;font-size:18px}.tile h3 span{color:var(--or)}
.tile .n{font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:6px}
.tile .n small{font-size:13px;color:var(--mute);font-weight:400;margin-left:6px}
.tile p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.st{display:inline-block;font-size:12px;padding:0 8px;border-radius:99px;margin-left:8px;vertical-align:2px;font-weight:500}
.st.live{background:var(--or);color:#fff}.st.soon{border:1px solid var(--line);color:var(--mute)}
.kband{background:var(--or);color:#fff;margin-top:28px}
.kband .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.k{padding:20px 12px 20px 0}.k b{display:block;font-size:clamp(26px,3vw,36px);font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}.k span{font-size:14px;opacity:.92}
h2.sec{font-size:24px;margin:36px 0 4px}
/* sub page (THE ITC style) */
.subvis{height:110px;background:linear-gradient(90deg,#e05a0c,#f26b1d 50%,#ff9152);margin-top:0;display:flex;align-items:center}
.subvis .wrap{width:100%;color:#fff;font-size:clamp(22px,3vw,30px);font-weight:700}
.sub{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;margin-top:0}
.lnb{border-right:1px solid var(--line);padding-bottom:40px}
.lnb .ttl{background:var(--or);color:#fff;font-size:22px;font-weight:700;padding:22px 20px;margin-top:28px}
.lnb ul{list-style:none;margin:16px 20px 0 0;padding:0}
.lnb li a{display:flex;align-items:center;min-height:44px;padding:0 6px;border-bottom:1px dashed var(--line);text-decoration:none;font-size:15px;font-weight:500}
.lnb li a.on{border-bottom:2px solid var(--or);font-weight:700}.lnb li a.on::before{content:"";width:12px;height:2px;background:var(--ink);margin-right:8px}
.lnb li a:hover{color:var(--or)}
.lnb .cnt{margin-left:auto;padding-left:6px;color:var(--mute);font-size:13px;font-weight:400}
.ct h2{font-size:clamp(24px,3vw,32px);margin:28px 0 12px}
.crumb{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 14px;font-size:14px;color:var(--mute)}
.crumb b{color:var(--ink);font-weight:500}
.lead{font-size:16px;margin:22px 0 4px;font-weight:700}.lead+p{margin:0;color:var(--mute);font-size:15px}
/* list */
.ctrl{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 12px;align-items:center}
input[type=search],select{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
input[type=search]{flex:1 1 240px}
label.tg{display:flex;gap:8px;align-items:center;min-height:44px;cursor:pointer;font-size:15px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--or)}
.cline{margin:0 0 8px;font-size:14px;color:var(--mute)}.cline b{color:var(--or);font-size:16px;margin-left:4px}
.list{border-top:2px solid var(--ink);transition:opacity .12s}
.it{padding:14px 4px;border-bottom:1px solid var(--line)}
.it.w{border-left:4px solid var(--or);padding-left:14px;background:var(--orl)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:13px;color:var(--mute);align-items:center}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border:1px solid var(--line);color:var(--ink);white-space:nowrap;border-radius:2px}
.tag.p1{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag.w{background:var(--or);color:#fff;border-color:var(--or)}
.tag.pi{border-style:dashed}
.it h3{font-size:16px;font-weight:500;margin:6px 0 2px;line-height:1.45}
.it h3 a{text-decoration:none}.it h3 a:hover{color:var(--or);text-decoration:underline}
.it p{margin:2px 0;font-size:14px;color:var(--mute)}
details{font-size:14px}summary{cursor:pointer;min-height:32px;display:list-item}
details li,details p{color:var(--mute)}
.links a{font-size:13px;margin-right:12px;color:var(--mute)}
.empty{padding:28px 20px;background:var(--soft);margin-top:16px}
.empty h3{margin:0 0 6px;font-size:17px}.empty p{margin:4px 0;color:var(--mute);font-size:15px}
.empty ul{margin:8px 0 0;padding-left:20px;font-size:15px}
.more{display:block;width:100%;min-height:44px;margin-top:12px;font:inherit;background:var(--bg);border:1px solid var(--line);cursor:pointer;color:var(--ink)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.dcard{border:1px solid var(--line);border-top:3px solid var(--or);padding:18px 20px}
.dcard h3{margin:0 0 6px;font-size:18px}.dcard p{margin:4px 0;font-size:15px;color:var(--mute)}.dcard ul{margin:8px 0 0;padding-left:18px;font-size:15px}
footer{margin-top:56px;background:var(--soft);border-top:1px solid var(--line);padding:22px 0;font-size:13px;color:var(--mute)}
@media(max-width:960px){.hero{grid-template-columns:minmax(0,1fr)}.sub{grid-template-columns:minmax(0,1fr);gap:0}.lnb{border-right:0;padding-bottom:0}.lnb .ttl{margin-top:0}.lnb ul{display:flex;overflow-x:auto;margin:0;gap:4px}.lnb li a{white-space:nowrap;border-bottom:0;padding:0 12px}.lnb li a.on::before{display:none}}
@media(max-width:600px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.kband .wrap,.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid{grid-template-columns:minmax(0,1fr)}nav.gnb{flex-wrap:nowrap;overflow-x:auto;width:100%}nav.gnb a{font-size:15px;padding:10px 9px}nav.gnb a.data{margin-left:0;padding-left:12px}.fig{min-height:130px}.tile{min-height:0;padding:14px}.tile .n{font-size:24px}}
@media(prefers-reduced-motion:no-preference){.tile,.notice li a{transition:background .15s,color .15s}}
</style></head><body>

": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) preliminarily determines on a country-wide basis that imports of certain corrosion- resistant steel products (CORE) completed in Indonesia using cold- rolled steel (CRS) manufactured in the Socialist Republic of Vietnam (Vietnam) are not circumventing the antidumping duty (AD) and countervailing duty (CVD) orders on CORE from Vietnam. The period of inquiry is January 1, 2025, through December 31, 2025. Interested parties are invited to comment on this preliminary determination.", "publication_date": "2026-11-24", "html_url": "https://www.federalregister.gov/documents/2026/11/24/2026-23944/certain-corrosion-resistant-steel-products-from-the-socialist-republic-of-vietnam-preliminary", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-24/pdf/2026-23944.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/24/2026-23944.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": true, "authority": "US"}, {"id": "2026-23943", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Steel Wheels from the People's Republic of China: Preliminary Affirmative Determination of Circumvention of the Antidumping Duty and Countervailing Duty Orders", "product": "Certain Steel Wheels", "countries": ["People's Republic of China"], "stage": "예비판정", "priority": 2, "remedy": "AD/CVD", "case_numbers": ["A-570-082", "C-570-083"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) preliminarily determines that imports of certain steel wheels (steel wheels), completed in the Socialist Republic of Vietnam (Vietnam) using hot- rolled steel (HRS) produced in the People's Republic of China (China), are circumventing the antidumping duty (AD) and countervailing duty (CVD) orders on steel wheels from China. Interested parties are invited to comment on this preliminary determination.", "publication_date": "2026-11-24", "html -products-from-the-peoples-republic-of-china-preliminary-negative", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-24/pdf/2026-23942.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/24/2026-23942.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": true, "authority": "US"}, {"id": "2026-23941", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Hydrofluorocarbon Blends From the People's Republic of China: Final Results of Antidumping Duty Administrative Review; 2024-2025", "product": "Hydrofluorocarbon Blends", "countries": ["People's Republic of China"], "stage": "연례재심 최종결과", "priority": 2, "remedy": "AD", "case_numbers": ["A-570-028"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) determines that producers/exporters subject to this review made sales of subject merchandise at less than normal value during the period of review (POR) August 1, 2024, through July 31, 2025.", "publication_date": "2026-11-24", "html_url": "https://www.federalregister.gov/documents/2026/11/24/2026-23941/hydrofluorocarbon-blends-from-the-peoples-republic-of-china-final-results-of-antidumping-duty", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-24/pdf/2026-23941.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/24/2026-23941.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": true, "authority": "US"}, {"id": "2026-23940", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Light-Walled Rectangular Pipe and Tube From the People's Republic of China: Final Results of Countervailing Duty Administrative Review; 2024", "product": "Light-Walled Rectangular Pipe and Tube", "countries": ["People's Republic of China"], "stage": "연례재심 최종결과", "priority": 2, "remedy": "CVD", "case_numbers": ["C-570-915"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) determines that countervaila "status": "게재", "agency": "ITC", "title": "Magnesia Carbon Bricks From China and Mexico; Scheduling of Expedited Five-Year Reviews", "product": "Magnesia Carbon Bricks", "countries": ["China", "Mexico"], "stage": "일몰재심", "priority": 2, "remedy": "AD/CVD", "case_numbers": ["701-TA-468", "731-TA-1166"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice of the scheduling of expedited reviews pursuant to the Tariff Act of 1930 (\"the Act\") to determine whether revocation of the countervailing duty order on magnesia carbon bricks from China and the antidumping duty orders on magnesia carbon bricks from China and Mexico would be likely to lead to continuation or recurrence of material injury within a reasonably foreseeable time.", "publication_date": "2026-11-23", "html_url": "https://www.federalregister.gov/documents/2026/11/23/2026-23810/magnesia-carbon-bricks-from-china-and-mexico-scheduling-of-expedited-five-year-reviews", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-23/pdf/2026-23810.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/23/2026-23810.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": true, "authority": "US"}, {"id": "2026-23802", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Cold-Rolled Steel Flat Products From the Republic of Korea: Preliminary Results and Rescission, in Part of Countervailing Duty Administrative Review; 2024", "product": "Certain Cold-Rolled Steel Flat Products", "countries": ["Republic of Korea"], "stage": "재심 철회", "priority": 3, "remedy": "CVD", "case_numbers": ["C-580-882"], "watch": ["Korea", "사건번호 580"], "snippets": ["[C-580-882]", "Korea: Preliminary Results and Rescission, in Part of Countervailing Duty Administrative Review; 2024", "(cold-rolled steel) from the Republic of Korea (Korea). The period of review (POR) is January 1, 2024, through December 31, 2024. In addition, Commerce is rescinding this review, in part, with respect to", "Korea.\\3\\ On January 8, 2026, Commerce selected Hyundai Steel and POSCO as the mandatory respondents in this review.\\4\\ On March 5, 2026, Nucor Corporation, Cleveland-Cliffs Inc., Steel Dynamics Inc., and United", "Republic of Korea: Amended Final Affirmative Countervailing Duty Determination and Countervailing Duty Order (the Republic of Korea) and Countervailing Duty Orders (Brazil and India), 81 FR 64436", "Cold-Rolled Steel Flat Products from the Republic of Korea; 2024,'' dated concurrently with, and hereby adopted by, this notice (Preliminary Decision Memorandum).", "The product covered by the Order is cold-rolled steel from Korea. For a complete description of the scope of the Order, see the Preliminary Decision Memorandum.", "IV. Diversification of Korea's Economy V. Subsidies Valuation Information VI. Benchmarks and Interest Rates", "2. Amerisource Korea 3. BC Trade 4. Busung Steel Co., Ltd.", "30. Okaya (Korea) Co., Ltd. 31. PL Special Steel Co., Ltd. 32. POSCO C&C Co. Ltd."], "abstract": "The U.S. Department of Commerce (Commerce) preliminarily determines that countervailable subsidies were provided to Hyundai Steel Company (Hyundai Steel) and POSCO for the production of certain cold-rolled steel flat products (cold-rolled steel) from the Republic of Korea (Korea). The period of review (POR) is January 1, 2024, through December 31, 2024. In addition, Commerce is rescinding this review, in part, with respect to 46 companies. Interested parties are invited to comment on these preliminary results.", "publication_date": "2026-11-23", "html_url": "https://www.federalregister.gov/documents/2026/11/23/2026-23802/certain-cold-rolled-steel-flat-products-from-the-republic-of-korea-preliminary-results-and", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-23/pdf/2026-23802.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/23/2026-23802.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": true, "authority": "US"}, {"id": "2026-23794", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "United States-Mexico-Canada Agreement (USMCA), Article 10.12: Binational Panel Review: Notice of Request for Panel Review", "product": "", "countries": [], "stage": "기타", "priority": 3, "remedy": "CVD", "case_numbers": [], "watch": [], "snippets": [], "abstract": "Two Requests for Panel Review were filed in the matter of Certain Softwood Lumber Products from Canada: Final Results of Countervailing Duty Administrative Review, 2024 with the U.S. Section of the USMCA Secretariat on November 18, 2026. The USMCA Secretariat has assigned case number USA-CDA-2026-10.12-01 to this request. The first Request for Panel Review was filed on behalf of the Government of Canada, the Governments of Alberta, British Columbia, New Brunswick, Ontario, and Qu[eacute]bec; Alberta Softwood Lumber Trade Council, British Columbia Lumber Trade Council; Canfor Corporation, Interfor Corporation, Interfor Sales & Marketing Ltd., EACOM Timber Corporation, Chaleur Forest Products Inc., Chaleur Forest Products LP, J.D. Irving, Limited, Tolko Marketing and Sales Ltd. and Tolko Industries Ltd., Gilbert Smith Forest Products, as well as West Fraser Mills Ltd. The second Request for Panel Review was filed on behalf of Resolute FP Canada Inc., the Conseil de l'industrie foresti[egrave]re du Qu[eacute]bec, the Ontario Forest Industries Association, and each association's respective individual members listed in Attachment A of the Request for Panel Review (collectively \"Central ", "publication_date": "2026-11-23", "html_url": "https://www.federalregister.gov/documents/2026/11/23/2026-23794/united-states-mexico-canada-agreement-usmca-article-1012-binational-panel-review-notice-of-request", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-23/pdf/2026-23794.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/23/2026-23794.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": true, "authority": "US"}, {"id": "2026-23790", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "United States-Mexico-Canada Agreement (USMCA), Article 10.12: Binational Panel Review: Notice of Request for Panel Review", "product": "", "countries": [], "stage": "기타", "priority": 3, "remedy": "AD", "case_numbers": [], "watch": [], "snippets": [], "abstract": "Two Requests for Panel Review were filed in the matter of Certain Softwood Lumber Products From Canada: Final Results of Antidumping Duty Administrative Review, Partial Rescission of Administrative Review, and Final Determination of No Shipments; 2024 with the U.S. Section of the USMCA Secretariat on November 18, 2026. The USMCA Secretariat has assigned case number USA-CDA-2026-10.12-02 to this request. The first Request for Panel Review was filed on behalf of Resolute FP Canada Inc., the Conseil de l'industrie foresti[egrave]re du Qu[eacute]bec, the Ontario Forest Industries Association, and each association's respective individual members listed in Attachment A of the Request for Panel Review (collectively \"Central Canada\"); Plaster Rock Lumber Corporation; as well as CHAP Alliance Inc. The second Request for Panel Review was filed on behalf of Government of Canada, the Governments of Alberta, British Columbia, Ontario, and Qu[eacute]bec; Alberta Softwood Lumber Trade Council, British Columbia Lumber Trade Council; Canfor Corporation, Canadian Forest Products Ltd., Canfor Wood Products Marketing Ltd., Canfor Fox Creek Ltd., Canfor Whitecourt Ltd., Fontaine Inc., Interfor Corporat", "publication_date": "2026-11-23", "html_url": "https://www.federalregister.gov/documents/2026/11/23/2026-23790/united-states-mexico-canada-agreement-usmca-article-1012-binational-panel-review-notice-of-request", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-23/pdf/2026-23790.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/1  Act of 1930 to determine whether there is a reasonable indication that an industry in the United States is materially injured or threatened with material injury, or the establishment of an industry in the United States is materially retarded, by reason of imports of plastic balloons from China, provided for in subheadings 9503.00.00 and 9505.90.60 of the Harmonized Tariff Schedule of the United States, that are alleged to be sold in the United States at less than fair value and alleged to be subsidized by the Government of China. Unless the Department of Commerce (\"Commerce\") extends the time for initiation, the Commission must reach a preliminary determination in antidumping and countervailing duty investigations in 45 days, or in this case by January 4, 2027 The Commission's views must be transmitted to Commerce within five business days thereafter, or by January 11, 2027.", "publication_date": "2026-11-23", "html_url": "https://www.federalregister.gov/documents/2026/11/23/2026-23751/plastic-balloons-from-china-institution-of-antidumping-and-countervailing-duty-investigations-and", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-23/pdf/2026-23751.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/23/2026-23751.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": true, "authority": "US"}, {"id": "2026-23626", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Freight Rail Couplers and Parts Thereof From the Czech Republic and India: Amended Final Determinations of Sales at Less Than Fair Value and Antidumping Duty Orders", "product": "Certain Freight Rail Couplers and Parts Thereof", "countries": ["Czech Republic", "India"], "stage": "최종판정", "priority": 2, "remedy": "AD", "case_numbers": ["A-533-940", "A-851-806"], "watch": [], "snippets": [], "abstract": "Based on affirmative final determinations by the U.S. Department of Commerce (Commerce) and the U.S. International Trade Commissi ) order on diamond sawblades and parts thereof (diamond sawblades) from the People's Republic of China (China) would likely lead to the continuation or recurrence of dumping and material injury to an industry in the United States, Commerce is publishing a notice of continuation of this AD order.", "publication_date": "2026-11-16", "html_url": "https://www.federalregister.gov/documents/2026/11/16/2026-23253/diamond-sawblades-and-parts-thereof-from-the-peoples-republic-of-china-continuation-of-antidumping", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-16/pdf/2026-23253.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/16/2026-23253.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": true, "authority": "US"}, {"id": "2026-23250", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Notice of Scope Ruling Applications Filed in Antidumping and Countervailing Duty Proceedings", "product": "", "countries": [], "stage": "범위 판정", "priority": 3, "remedy": "AD/CVD", "case_numbers": [], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) received scope ruling applications, requesting that scope inquiries be conducted to determine whether identified products are covered by the scope of antidumping duty (AD) and/or countervailing duty (CVD) orders and that Commerce issue scope rulings pursuant to those inquiries. In accordance with Commerce's regulations, we are notifying the public of the filing of the scope ruling applications listed below in the month of September 2026.", "publication_date": "2026-11-16", "html_url": "https://www.federalregister.gov/documents/2026/11/16/2026-23250/notice-of-scope-ruling-applications-filed-in-antidumping-and-countervailing-duty-proceedings", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-16/pdf/2026-23250.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/16/2026-23250.txt", "first_seen": " e assigned to POSCO Co., Ltd. (POSCO).", "publication_date": "2026-11-06", "html_url": "https://www.federalregister.gov/documents/2026/11/06/2026-22706/certain-carbon-and-alloy-steel-cut-to-length-plate-from-the-republic-of-korea-notice-of-court", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-06/pdf/2026-22706.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/06/2026-22706.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": true, "authority": "US"}, {"id": "2026-22660", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Frozen Warmwater Shrimp From the Socialist Republic of Vietnam: Final Results of Antidumping Duty Administrative Review; 2024-2025", "product": "Certain Frozen Warmwater Shrimp", "countries": ["Socialist Republic of Vietnam"], "stage": "연례재심 최종결과", "priority": 2, "remedy": "AD", "case_numbers": ["A-552-802"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) determines that producers/exporters subject to this administrative review made sales of certain frozen warmwater shrimp (shrimp) from the Socialist Republic of Vietnam (Vietnam) at prices below normal value (NV) during the period of review (POR), February 1, 2024, through January 31, 2025. Additionally, Commerce determines that 29 exporters are eligible for separate rates.", "publication_date": "2026-11-06", "html_url": "https://www.federalregister.gov/documents/2026/11/06/2026-22660/certain-frozen-warmwater-shrimp-from-the-socialist-republic-of-vietnam-final-results-of-antidumping", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-06/pdf/2026-22660.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/06/2026-22660.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": true, "authority": "US"}, {"id": "2026-22658", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Steel Wire Garment Hangers From the People's Repu y. The period of review (POR) is August 1, 2024, through July 31, 2025. In addition, we are rescinding the review with respect to 39 companies. Interested parties are invited to comment on these preliminary results of review.", "publication_date": "2026-11-04", "html_url": "https://www.federalregister.gov/documents/2026/11/04/2026-22528/light-walled-rectangular-pipe-and-tube-from-the-peoples-republic-of-china-preliminary-results-and", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-04/pdf/2026-22528.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/04/2026-22528.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-22527", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Utility Scale Wind Towers From India: Final Results of the Expedited First Sunset Review of the Countervailing Duty Order", "product": "Utility Scale Wind Towers", "countries": ["India"], "stage": "관세부과 명령", "priority": 2, "remedy": "CVD", "case_numbers": ["C-533-898"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) finds that revocation of the countervailing duty (CVD) order on utility scale wind towers (wind towers) from India would be likely to lead to continuation or recurrence of countervailable subsidies at the levels indicated in the \"Final Results of Sunset Review\" section of this notice.", "publication_date": "2026-11-04", "html_url": "https://www.federalregister.gov/documents/2026/11/04/2026-22527/utility-scale-wind-towers-from-india-final-results-of-the-expedited-first-sunset-review-of-the", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-04/pdf/2026-22527.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/04/2026-22527.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-22526", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title" id) and all other producers and/or exporters.", "publication_date": "2026-11-02", "html_url": "https://www.federalregister.gov/documents/2026/11/02/2026-22351/corrosion-resistant-steel-products-from-mexico-notice-of-court-decision-not-in-harmony-with-the", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-02/pdf/2026-22351.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/02/2026-22351.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-22349", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Polyester Textured Yarn From Indonesia, Malaysia, Thailand, and Vietnam; Institution of Five-Year Reviews", "product": "Polyester Textured Yarn", "countries": ["Indonesia", "Malaysia", "Thailand", "Vietnam"], "stage": "일몰재심", "priority": 2, "remedy": "AD", "case_numbers": ["731-TA-1550"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice that it has instituted reviews pursuant to the Tariff Act of 1930, as amended, to determine whether revocation of the antidumping duty orders on polyester textured yarn from Indonesia, Malaysia, Thailand, and Vietnam would be likely to lead to continuation or recurrence of material injury. Pursuant to the Act, interested parties are requested to respond to this notice by submitting the information specified below to the Commission.", "publication_date": "2026-11-02", "html_url": "https://www.federalregister.gov/documents/2026/11/02/2026-22349/polyester-textured-yarn-from-indonesia-malaysia-thailand-and-vietnam-institution-of-five-year", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-02/pdf/2026-22349.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/02/2026-22349.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-22348", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Certain Mobile Access Equipment in Electric Co., Ltd (Iljin) did not make sales of subject merchandise at less than normal value (NV) during the period of review (POR), August 1, 2024, through July 31, 2025. Interested parties are invited to comment on these preliminary results of review.", "publication_date": "2026-11-02", "html_url": "https://www.federalregister.gov/documents/2026/11/02/2026-22343/large-power-transformers-from-the-republic-of-korea-preliminary-results-of-antidumping-duty", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-02/pdf/2026-22343.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/02/2026-22343.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-22313", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Antidumping or Countervailing Duty Order, Finding, or Suspended Investigation; Advance Notification of Sunset Review", "product": "", "countries": [], "stage": "관세부과 명령", "priority": 2, "remedy": "AD/CVD", "case_numbers": [], "watch": [], "snippets": [], "abstract": "", "publication_date": "2026-11-02", "html_url": "https://www.federalregister.gov/documents/2026/11/02/2026-22313/antidumping-or-countervailing-duty-order-finding-or-suspended-investigation-advance-notification-of", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-02/pdf/2026-22313.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/02/2026-22313.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-22312", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Initiation of Five-Year (Sunset) Reviews", "product": "", "countries": [], "stage": "일몰재심", "priority": 2, "remedy": "AD/CVD", "case_numbers": [], "watch": [], "snippets": [], "abstract": "In accordance with the Tariff Act of 1930, as amended (the Act), the U.S. Department of Commerce (Commerce) is automatically initiating the five-year reviews (Sunset Reviews) of the antidumping duty (AD) and countervailing duty (CVD) orders and suspended investigations listed below. The U.S. International Trade Commission (ITC) is publishing concurrently with this notice its notice of Institution of Five-Year Reviews which covers the same orders and suspended investigations.", "publication_date": "2026-11-02", "html_url": "https://www.federalregister.gov/documents/2026/11/02/2026-22312/initiation-of-five-year-sunset-reviews", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-02/pdf/2026-22312.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/02/2026-22312.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-22311", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Utility Scale Wind Towers From India, Malaysia, and Spain; Scheduling of Expedited Five-Year Reviews", "product": "Utility Scale Wind Towers", "countries": ["India", "Malaysia", "Spain"], "stage": "일몰재심", "priority": 2, "remedy": "AD/CVD", "case_numbers": ["701-TA-660", "731-TA-1543"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice of the scheduling of expedited reviews pursuant to the Tariff Act of 1930 (\"the Act\") to determine whether revocation of the countervailing duty orders on utility scale wind towers from India and Malaysia and the antidumping duty orders on utility scale wind towers from India, Malaysia, and Spain would be likely to lead to continuation or recurrence of material injury within a reasonably foreseeable time.", "publication_date": "2026-11-02", "html_url": "https://www.federalregister.gov/documents/2026/11/02/2026-22311/utility-scale-wind-towers-from-india-malaysia-and-spain-scheduling-of-expedited-five-year-reviews", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-02/pdf/2026-22311.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/02/2026-22311.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-22308", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Welded Stainless Line and Pressure Pipe From India, the Republic of Türkiye, and the United Arab Emirates: Postponement of Preliminary Determinations in the Less-Than-Fair-Value Investigations", "product": "Welded Stainless Line and Pressure Pipe", "countries": ["India", "Republic of Türkiye", "United Arab Emirates"], "stage": "예비판정", "priority": 2, "remedy": "AD", "case_numbers": ["A-489-858", "A-520-813", "A-533-950"], "watch": [], "snippets": [], "abstract": "", "publication_date": "2026-11-02", "html_url": "https://www.federalregister.gov/documents/2026/11/02/2026-22308/welded-stainless-line-and-pressure-pipe-from-india-the-republic-of-trkiye-and-the-united-arab", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-02/pdf/2026-22308.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/02/2026-22308.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-22282", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Twist Ties From China; Scheduling of Full Five-Year Reviews", "product": "Twist Ties", "countries": ["China"], "stage": "일몰재심", "priority": 2, "remedy": "AD/CVD", "case_numbers": ["701-TA-649", "731-TA-1523"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice of the scheduling of full reviews pursuant to the Tariff Act of 1930 to determine whether revocation of the countervailing and antidumping duty orders on twist ties from China would be likely to lead to continuation or recurrence of material injury within a reasonably foreseeable time. The Commission has determined to exercise its authority to extend the review period by up to 90 days.", "publication_date": "2026-11-02", "html_url": "https://www.federalregister.gov/documents/2026/11/02/2026-22282/twist-ties-from-china-scheduling-of-full-five-year-reviews", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-02/pdf/2026-22282.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/02/2026-22282.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-22281", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Shopping Carts and Parts Thereof From China; Institution of Antidumping and Countervailing Duty Investigations and Scheduling of Preliminary Phase Investigations", "product": "Shopping Carts and Parts Thereof", "countries": ["China"], "stage": "신규 조사 개시(ITC)", "priority": 1, "remedy": "AD/CVD", "case_numbers": ["701-TA-811", "731-TA-1813"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice of the institution of investigations and commencement of preliminary phase antidumping and countervailing duty investigation Nos. 701-TA-811 and 731-TA-1813 (Preliminary) pursuant to the Tariff Act of 1930 to determine whether there is a reasonable indication that an industry in the United States is materially injured or threatened with material injury, or the establishment of an industry in the United States is materially retarded, by reason of imports of shopping carts and parts thereof from China, provided for in subheading 8716.80.50 of the Harmonized Tariff Schedule of the United States, that are alleged to be sold in the United States at less than fair value and alleged to be subsidized by the Government of China. Unless the Department of Commerce (\"Commerce\") extends the time for initiation, the Commission must reach a preliminary determination in antidumping and countervailing duty investigations in 45 days, or in this case by December 14, 2026. The Commission's views must be transmitted to Commerce within five business days thereafter, or by December 21, 2026.", "publication_date": "2026-11-02", "html_url": "https://www.federalregister.gov/documents/2026/11/02/2026-22281/shopping-carts-and-parts-thereof-from-china-institution-of-antidumping-and-countervailing-duty", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-11-02/pdf/2026-22281.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/11/02/2026-22281.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-22245", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Utility Scale Wind Towers From Malaysia: Final Results of the Expedited First Sunset Review of the Countervailing Duty Order", "product": "Utility Scale Wind Towers", "countries": ["Malaysia"], "stage": "관세부과 명령", "priority": 2, "remedy": "CVD", "case_numbers": ["C-557-822"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) finds that revocation of the countervailing duty (CVD) order on utility scale wind towers (wind towers) from Malaysia would be likely to lead to continuation or recurrence of countervailable subsidies at the levels indicated in the \"Final Results of Sunset Review\" section of this notice.", "publication_date": "2026-10-30", "html_url": "https://www.federalregister.gov/documents/2026/10/30/2026-22245/utility-scale-wind-towers-from-malaysia-final-results-of-the-expedited-first-sunset-review-of-the", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-30/pdf/2026-22245.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/30/2026-22245.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-22233", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Strontium Chromate From France: Final Results of Antidumping Duty Administrative Review; 2023-2024", "product": "Strontium Chromate", "countries": ["France"], "stage": "연례재심 최종결과", "priority": 2, "remedy": "AD", "case_numbers": ["A-427-830"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) determines that Soci[eacute]t[eacute] Nouvelle des Couleurs Zinciques (SNCZ) did not make sales of strontium chromate from France in the United States at less than normal value (NV) during the period of review (POR) November 1, 2023, through October 31, 2024.", "publication_date": "2026-10-30", "html_url": "https://www.federalregister.gov/documents/2026/10/30/2026-22233/strontium-chromate-from-france-final-results-of-antidumping-duty-administrative-review-2023-2024", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-30/pdf/2026-22233.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/30/2026-22233.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-22167", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Ironing Tables and Certain Parts Thereof From China; Scheduling of an Expedited Five-Year Review", "product": "Ironing Tables and Certain Parts Thereof", "countries": ["China"], "stage": "일몰재심", "priority": 2, "remedy": "AD", "case_numbers": ["731-TA-1047"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice of the scheduling of an expedited review pursuant to the Tariff Act of 1930 (\"the Act\") to determine whether revocation of the antidumping duty order on ironing tables and certain parts thereof from China would be likely to lead to continuation or recurrence of material injury within a reasonably foreseeable time.", "publication_date": "2026-10-30", "html_url": "https://www.federalregister.gov/documents/2026/10/30/2026-22167/ironing-tables-and-certain-parts-thereof-from-china-scheduling-of-an-expedited-five-year-review", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-30/pdf/2026-22167.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/30/2026-22167.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-22126", " nal determinations by the U.S. Department of Commerce (Commerce) and the U.S. International Trade Commission (ITC), Commerce is issuing antidumping duty (AD) and countervailing duty (CVD) orders on van-type trailers and subassemblies thereof (van-type trailers) from the People's Republic of China (China).", "publication_date": "2026-10-28", "html_url": "https://www.federalregister.gov/documents/2026/10/28/2026-21929/van-type-trailers-and-subassemblies-thereof-from-the-peoples-republic-of-china-antidumping-duty", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-28/pdf/2026-21929.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/28/2026-21929.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-21819", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Small Vertical Shaft Engines Between 99cc and up to 225cc, and Parts Thereof From the People's Republic of China: Continuation of Antidumping and Countervailing Duty Orders", "product": "Certain Small Vertical Shaft Engines Between 99cc and up to 225cc, and Parts Thereof", "countries": ["People's Republic of China"], "stage": "관세부과 명령", "priority": 2, "remedy": "AD/CVD", "case_numbers": ["A-570-124", "C-570-125"], "watch": [], "snippets": [], "abstract": "As a result of the determinations by the U.S. Department of Commerce (Commerce) and the U.S. International Trade Commission (ITC) that revocation of the antidumping duty (AD) and countervailing duty (CVD) orders on certain small vertical shaft engines between 99cc and 225cc, and parts thereof (small vertical engines) from the People's Republic of China (China) would likely lead to the continuation or recurrence of dumping, countervailable subsidies, and material injury to an industry in the United States, Commerce is publishing a notice of continuation of these AD and CVD orders.", "publication_date": "2026-10-26", "html_url": "https://www.federalregister.gov/documents/2026/10/26/2026-21819/certain-small-vertical-shaft-engines-between-99cc-and-up-to-225cc-and-parts-thereof-from-the-peoples", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-26/pdf/2026-21819.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/26/2026-21819.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-21793", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Carbazole Violet Pigment-23 From India: Final Results, and Rescission, in Part of Countervailing Duty Administrative Review; 2023", "product": "Carbazole Violet Pigment-23", "countries": ["India"], "stage": "재심 철회", "priority": 3, "remedy": "CVD", "case_numbers": ["C-533-839"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) has conducted an administrative review of Navpad Pigments Private Limited (Navpad) regarding the countervailing duty order on carbazole violet pigment 23 (CVP-23) from India. The period of review (POR) is January 1, 2023, through December 31, 2023. In addition, Commerce is rescinding this review, in part, with respect to one company.", "publication_date": "2026-10-26", "html_url": "https://www.federalregister.gov/documents/2026/10/26/2026-21793/carbazole-violet-pigment-23-from-india-final-results-and-rescission-in-part-of-countervailing-duty", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-26/pdf/2026-21793.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/26/2026-21793.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-21792", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Notice of Extension of the Deadline for Determining the Adequacy of the Antidumping and Countervailing Duty Petitions: Certain Railway Tank Cars and Parts Thereof From Mexico", "product": "Notice of Extension of the Deadline for Det ": "상무부(ITA)", "title": "Heavy-Walled Rectangular Welded Carbon Steel Pipes and Tubes From Mexico: Initiation and Expedited Preliminary Results of Changed Circumstances Review", "product": "Heavy-Walled Rectangular Welded Carbon Steel Pipes and Tubes", "countries": ["Mexico"], "stage": "상황변경재심", "priority": 2, "remedy": "AD", "case_numbers": ["A-201-847"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) is simultaneously initiating and issuing the preliminary results of a changed circumstances review (CCR) of the antidumping duty (AD) order on heavy- walled rectangular welded carbon steel pipes and tubes (HWR) from Mexico, consistent with section 751(b) of the Tariff Act of 1930, as amended (the Act), and 19 CFR 351.216 and 351.221(c)(3)(ii). Based on the information on the record, we preliminarily determine that Perfiles LM, S.A. de C.V. (PLM) is the successor-in-interest to Perfiles y Herrajes LM, S.A. de C.V. (PyH). Interested parties are invited to comment on these preliminary results.", "publication_date": "2026-10-26", "html_url": "https://www.federalregister.gov/documents/2026/10/26/2026-21790/heavy-walled-rectangular-welded-carbon-steel-pipes-and-tubes-from-mexico-initiation-and-expedited", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-26/pdf/2026-21790.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/26/2026-21790.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-21783", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Corrugated Die-Cut Cardboard Boxes From the People's Republic of China, Malaysia, and the Republic of Türkiye: Initiation of Less-Than-Fair-Value Investigations", "product": "Certain Corrugated Die-Cut Cardboard Boxes", "countries": ["People's Republic of China", "Malaysia", "Republic of Türkiye"], "stage": "신규 조사 개시(상무부)", "priority": 1, "remedy": "AD", "case_numbers": ["A-489-8  Mouldings and Millwork Products", "countries": ["People's Republic of China"], "stage": "기타", "priority": 3, "remedy": "AD", "case_numbers": ["A-570-117"], "watch": [], "snippets": [], "abstract": "On September 23, 2026, the U.S. Court of International Trade (CIT) issued its final judgment in China Cornici Co., Ltd. and Raoping Hongrong Handicrafts Co., Ltd. v. United States, Court nos. 23-00216 & 23-00217, sustaining the first remand results issued by the U.S. Department of Commerce (Commerce) pertaining to the administrative review of the antidumping duty (AD) order on wood mouldings and millwork products from the People's Republic of China (China), covering the period of review (POR) August 12, 2020, through January 31, 2022. Commerce is notifying the public that the CIT's final judgment is not in harmony with Commerce's final results of the administrative review, and that Commerce is amending the final results with respect to the rescission of the administrative review for China Cornici Co. Ltd. (China Cornici) and the corresponding cash deposit rate assigned to the company.", "publication_date": "2026-10-15", "html_url": "https://www.federalregister.gov/documents/2026/10/15/2026-21045/wood-mouldings-and-millwork-products-from-the-peoples-republic-of-china-notice-of-court-decision-not", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-15/pdf/2026-21045.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/15/2026-21045.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-21044", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Forged Steel Fluid End Blocks from Italy: Notice of Court Decision Not in Harmony With the Results of Antidumping Administrative Review; Notice of Amended Final Results", "product": "Forged Steel Fluid End Blocks", "countries": ["Italy"], "stage": "기타", "priority": 3, "remedy": "AD", "case_numbers": ["A-475-840"], "watch": [], "sn  ["701-TA-639", "731-TA-1475"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice of the scheduling of full reviews pursuant to the Tariff Act of 1930 to determine whether revocation of the countervailing duty orders on common alloy aluminum sheet (\"CAAS\") from Bahrain, India, and Turkey and the revocation of the antidumping duty orders on CASS from Bahrain, Brazil, Croatia, Egypt, Germany, India, Indonesia, Italy, Oman, Romania, Serbia, Slovenia, South Africa, Spain, Taiwan, and Turkey would be likely to lead to continuation or recurrence of material injury within a reasonably foreseeable time. The Commission has determined to exercise its authority to extend the review period by up to 90 days.", "publication_date": "2026-10-14", "html_url": "https://www.federalregister.gov/documents/2026/10/14/2026-20904/common-alloy-aluminum-sheet-from-bahrain-brazil-croatia-egypt-germany-india-indonesia-italy-oman", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-14/pdf/2026-20904.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/14/2026-20904.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20903", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Fatty Acids From Indonesia and Malaysia; Scheduling of the Final Phase of Countervailing Duty and Antidumping Duty Investigations", "product": "Fatty Acids", "countries": ["Indonesia", "Malaysia"], "stage": "일정·청문회", "priority": 3, "remedy": "AD/CVD", "case_numbers": ["701-TA-785", "731-TA-1773"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice of the scheduling of the final phase of antidumping and countervailing duty investigation Nos. 701-TA-785-786 and 731-TA-1773-1774 (Final) pursuant to the Tariff Act of 1930 to determine whether an industry in the United States is materially injured or threatened with material injury, or the establishment of an industry in the /documents/full_text/text/2026/10/05/2026-20376.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20349", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Railway Tank Cars and Parts Thereof From Mexico; Institution of Antidumping and Countervailing Duty Investigations and Scheduling of Preliminary Phase Investigations", "product": "Railway Tank Cars and Parts Thereof", "countries": ["Mexico"], "stage": "신규 조사 개시(ITC)", "priority": 1, "remedy": "AD/CVD", "case_numbers": ["701-TA-809", "731-TA-1810"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice of the institution of investigations and commencement of preliminary phase antidumping and countervailing duty investigation Nos. 701-TA-809 and 731-TA-1810 (Preliminary) pursuant to the Tariff Act of 1930 to determine whether there is a reasonable indication that an industry in the United States is materially injured or threatened with material injury, or the establishment of an industry in the United States is materially retarded, by reason of imports of railway tank cars and parts thereof from Mexico, provided for in subheading 8606.10.00 of the Harmonized Tariff Schedule of the United States, that are alleged to be sold in the United States at less than fair value and alleged to be subsidized by the government of Mexico. Unless the Department of Commerce (\"Commerce\") extends the time for initiation, the Commission must reach a preliminary determination in antidumping and countervailing duty investigations in 45 days, or in this case by November 16, 2026. The Commission's views must be transmitted to Commerce within five business days thereafter, or by November 23, 2026.", "publication_date": "2026-10-05", "html_url": "https://www.federalregister.gov/documents/2026/10/05/2026-20349/railway-tank-cars-and-parts-thereof-from-mexico-institution-of-antidumping-and-countervailing-duty", "pdf_url": "https://www.govinfo.gov/content/pk  "case_numbers": [], "watch": [], "snippets": [], "abstract": "", "publication_date": "2026-10-02", "html_url": "https://www.federalregister.gov/documents/2026/10/02/2026-20269/antidumping-or-countervailing-duty-order-finding-or-suspended-investigation-opportunity-to-request", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-02/pdf/2026-20269.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/02/2026-20269.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20259", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Melamine From the People's Republic of China: Final Results of the Expedited Second Sunset Review of the Countervailing Duty Order", "product": "Melamine", "countries": ["People's Republic of China"], "stage": "관세부과 명령", "priority": 2, "remedy": "CVD", "case_numbers": ["C-570-021"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) finds that revocation of the countervailing duty (CVD) order on melamine from the People's Republic of China (China) would be likely to lead to continuation or recurrence of countervailable subsidies at the levels indicated in the \"Final Results of Sunset Review\" section of this notice.", "publication_date": "2026-10-02", "html_url": "https://www.federalregister.gov/documents/2026/10/02/2026-20259/melamine-from-the-peoples-republic-of-china-final-results-of-the-expedited-second-sunset-review-of", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-02/pdf/2026-20259.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/02/2026-20259.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20258", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Carbon Steel Butt-Weld Pipe Fittings From the People's Republic of China: Notice of Court Decision Not in Harmony With Final Covered Merchandise Determination and Notice of Amended Covered Merchandise Determination Pursuant to Court Decision; Correction", "product": "Certain Carbon Steel Butt-Weld Pipe Fittings", "countries": ["People's Republic of China"], "stage": "기타", "priority": 3, "remedy": "AD", "case_numbers": ["A-570-814"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) published notice to the public in the Federal Register of August 28, 2026 that the U.S. Court of International Trade's (CIT) final judgment was not in harmony with Commerce's covered merchandise inquiry (CMI) determination. Specifically, Commerce amended the CMI determination to find that products cut to length and formed into the rough shape of certain carbon steel butt-weld pipe fittings (butt-weld pipe fittings) in the People's Republic of China (China) represent \"unfinished\" fittings, which are covered by the scope of the Order, and that when such products are further processed in the Socialist Republic of Vietnam (Vietnam), they remain subject to the antidumping (AD) order on butt- weld pipe fittings from China. This notice did not provide clear notice to parties that the liquidation of entries of these unfinished fittings will be retroactively suspended.", "publication_date": "2026-10-02", "html_url": "https://www.federalregister.gov/documents/2026/10/02/2026-20258/certain-carbon-steel-butt-weld-pipe-fittings-from-the-peoples-republic-of-china-notice-of-court", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-10-02/pdf/2026-20258.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/10/02/2026-20258.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-20257", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Notice of Extension of the Deadline for Determining the Adequacy of the Antidumping and Countervailing Duty Petitions: Certain Corrugated Die-Cut Cardboard Boxes From t
