tatus": "게재", "agency": "상무부(ITA)", "title": "Boltless Steel Shelving Units Prepackaged for Sale From the People's Republic of China: Final Results of the Expedited Second Sunset Review of the Countervailing Duty Order", "product": "Boltless Steel Shelving Units Prepackaged for Sale", "countries": ["People's Republic of China"], "stage": "관세부과 명령", "priority": 2, "remedy": "CVD", "case_numbers": ["C-570-019"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) finds that revocation of the countervailing duty (CVD) order on boltless steel shelving units prepackaged for sale (boltless steel shelving) from the People's Republic of China (China) would be likely to lead to continuation or recurrence of countervailable subsidies at the levels indicated in the \"Final Results of Sunset Review\" section of this notice.", "publication_date": "2026-08-04", "html_url": "https://www.federalregister.gov/documents/2026/08/04/2026-15742/boltless-steel-shelving-units-prepackaged-for-sale-from-the-peoples-republic-of-china-final-results", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-04/pdf/2026-15742.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/04/2026-15742.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-15722", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Linear Hydraulic Cylinders From Canada, China, India, Mexico, and South Korea; Institution of Antidumping and Countervailing Duty Investigations and Scheduling of Preliminary Phase Investigations", "product": "Linear Hydraulic Cylinders", "countries": ["Canada", "China", "India", "Mexico", "South Korea"], "stage": "신규 조사 개시(ITC)", "priority": 1, "remedy": "AD/CVD", "case_numbers": ["701-TA-802", "731-TA-1799"], "watch": ["Korea"], "snippets": [], "abstract": "The Commission hereby gives notice of the institution of investigations and commencement of preliminary phase antidumping and countervailing duty investigation Nos. 701-TA-802-804 and 731-TA-1799- 1803 (Preliminary) pursuant to the Tariff Act of 1930 to determine whether there is a reasonable indication that an industry in the United States is materially injured or threatened with material injury, or the establishment of an industry in the United States is materially retarded, by reason of imports of linear hydraulic cylinders from Canada, China, India, Mexico, and South Korea, provided for in subheadings 8412.21.00 and 8412.90.90 of the Harmonized Tariff Schedule of the United States, that are alleged to be sold in the United States at less than fair value and alleged to be subsidized by the Governments of China, India, and Mexico. Unless the Department of Commerce (\"Commerce\") extends the time for initiation, the Commission must reach a preliminary determination in antidumping and countervailing duty investigations in 45 days, or in this case by September 14, 2026. The Commission's views must be transmitted to Commerce within five business days thereafter, or by September 21, 202", "publication_date": "2026-08-04", "html_url": "https://www.federalregister.gov/documents/2026/08/04/2026-15722/linear-hydraulic-cylinders-from-canada-china-india-mexico-and-south-korea-institution-of-antidumping", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-04/pdf/2026-15722.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/04/2026-15722.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-15664", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Thermal Paper From Germany: Final Results of Antidumping Duty Administrative Review; 2023-2024", "product": "Thermal Paper", "countries": ["Germany"], "stage": "연례재심 최종결과", "priority": 2, "remedy": "AD", "case_numbers": ["A-428-850"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) determines that thermal paper from Germany was not sold in the United States at less than normal value during the period of review (POR) November 1, 2023, through October 31, 2024.", "publication_date": "2026-08-03", "html_url": "https://www.federalregister.gov/documents/2026/08/03/2026-15664/thermal-paper-from-germany-final-results-of-antidumping-duty-administrative-review-2023-2024", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-03/pdf/2026-15664.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/03/2026-15664.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-15663", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Initiation of Five-Year (Sunset) Reviews", "product": "", "countries": [], "stage": "일몰재심", "priority": 2, "remedy": "AD/CVD", "case_numbers": [], "watch": [], "snippets": [], "abstract": "In accordance with the Tariff Act of 1930, as amended (the Act), the U.S. Department of Commerce (Commerce) is automatically initiating the five-year reviews (Sunset Reviews) of the antidumping duty (AD) and countervailing duty (CVD) orders and suspended investigations listed below. The U.S. International Trade Commission (ITC) is publishing concurrently with this notice its notice of Institution of Five-Year Reviews which covers the same orders and suspended investigations.", "publication_date": "2026-08-03", "html_url": "https://www.federalregister.gov/documents/2026/08/03/2026-15663/initiation-of-five-year-sunset-reviews", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-03/pdf/2026-15663.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/03/2026-15663.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-15662", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Antidumping or Countervailing Duty Order, Finding, or Suspended Investigation; Advance Notification of Sunset Review", "product": "", "countries": [], "stage": "관세부과 명령", "priority": 2, "remedy": "AD/CVD", "case_numbers": [], "watch": [], "snippets": [], "abstract": "", "publication_date": "2026-08-03", "html_url": "https://www.federalregister.gov/documents/2026/08/03/2026-15662/antidumping-or-countervailing-duty-order-finding-or-suspended-investigation-advance-notification-of", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-03/pdf/2026-15662.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/03/2026-15662.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-15646", "source": "US-FR", "status": "게재", "agency": "ITC", "title": "Certain Seamless Carbon and Alloy Steel Standard, Line, and Pressure Pipe From China; Institution of Five-Year Reviews", "product": "Certain Seamless Carbon and Alloy Steel Standard, Line, and Pressure Pipe", "countries": ["China"], "stage": "일몰재심", "priority": 2, "remedy": "AD/CVD", "case_numbers": ["701-TA-469", "731-TA-1168"], "watch": [], "snippets": [], "abstract": "The Commission hereby gives notice that it has instituted reviews pursuant to the Tariff Act of 1930, as amended, to determine whether revocation of the antidumping and countervailing duty orders on certain seamless carbon and alloy steel standard, line, and pressure pipe from China would be likely to lead to continuation or recurrence of material injury. Pursuant to the Act, interested parties are requested to respond to this notice by submitting the information specified below to the Commission.", "publication_date": "2026-08-03", "html_url": "https://www.federalregister.gov/documents/2026/08/03/2026-15646/certain-seamless-carbon-and-alloy-steel-standard-line-and-pressure-pipe-from-china-institution-of", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-08-03/pdf/2026-15646.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/08/03/2026-15646.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-15566", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Certain Vertical Shaft Engines Between 99cc and Up to 225cc, and Parts Thereof From the People's Republic of China: Final Results of the Expedited First Sunset Review of the Countervailing Duty Order", "product": "Certain Vertical Shaft Engines Between 99cc and Up to 225cc, and Parts Thereof", "countries": ["People's Republic of China"], "stage": "관세부과 명령", "priority": 2, "remedy": "CVD", "case_numbers": ["C-570-125"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) finds that revocation of the countervailing duty (CVD) order on certain vertical shaft engines between 99cc and up to 225cc, and parts thereof (small vertical engines) from the People's Republic of China (China) would be likely to lead to continuation or recurrence of countervailable subsidies at the levels indicated in the \"Final Results of Sunset Review\" section of this notice.", "publication_date": "2026-07-31", "html_url": "https://www.federalregister.gov/documents/2026/07/31/2026-15566/certain-vertical-shaft-engines-between-99cc-and-up-to-225cc-and-parts-thereof-from-the-peoples", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-07-31/pdf/2026-15566.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/07/31/2026-15566.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-15561", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Circular Welded Carbon Steel Pipes and Tubes from Thailand: Notice of Court Decision Not in Harmony With the Results of Antidumping Duty Administrative Review; Notice of Amended Final Results", "product": "Circular Welded Carbon Steel Pipes and Tubes", "countries": ["Thailand"], "stage": "기타", "priority": 3, "remedy": "AD", "case_numbers": ["A-549-502"], "watch": [], "snippets": [], "abstract": "On July 17, 2026, the U.S. Court of International Trade (CIT) issued its final judgment in Saha Thai Steel Pipe Public Company Limited v. United States, Court no. 21-00627, sustaining the U.S. Department of Commerce (Commerce)'s third remand results pertaining to the administrative review of the antidumping duty (AD) order on circular welded carbon steel pipes and tubes from Thailand covering the period of review March 1, 2019, through February 29, 2020. Commerce is notifying the public that the CIT's final judgment is not in harmony with Commerce's final results of the review, and that Commerce is amending the final results with respect to the dumping margin assigned to Saha Thai Steel Pipe Public Co., Ltd. (Saha Thai) and Thai Premium Pipe Co., Ltd. (Thai Premium).", "publication_date": "2026-07-31", "html_url": "https://www.federalregister.gov/documents/2026/07/31/2026-15561/circular-welded-carbon-steel-pipes-and-tubes-from-thailand-notice-of-court-decision-not-in-harmony", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-07-31/pdf/2026-15561.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/07/31/2026-15561.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-15559", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Truck Bed Covers From China: Preliminary Affirmative Countervailing Duty Determination", "product": "Truck Bed Covers", "countries": ["China"], "stage": "기타", "priority": 3, "remedy": "CVD", "case_numbers": ["C-570-224"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) preliminarily determines that countervailable subsidies are being provided to producers and exporters of truck bed covers from the People's Republic of China (China). The period of investigation (POI) is January 1, 2025, through December 31, 2025. Interested parties are invited to comment on this preliminary determination.", "publication_date": "2026-07-31", "html_url": "https://www.federalregister.gov/documents/2026/07/31/2026-15559/truck-bed-covers-from-china-preliminary-affirmative-countervailing-duty-determination", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-07-31/pdf/2026-15559.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/07/31/2026-15559.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id": "2026-15558", "source": "US-FR", "status": "게재", "agency": "상무부(ITA)", "title": "Common Alloy Aluminum Sheet From the Sultanate of Oman: Amended Final Results of Antidumping Duty Administrative Review; 2023-2024; Correction", "product": "Common Alloy Aluminum Sheet", "countries": ["Sultanate of Oman"], "stage": "연례재심 최종결과", "priority": 2, "remedy": "AD", "case_numbers": ["A-523-814"], "watch": [], "snippets": [], "abstract": "The U.S. Department of Commerce (Commerce) published a notice in the Federal Register on May 29, 2026, in which Commerce issued the amended final results of the administrative review of the antidumping duty (AD) order on common alloy aluminum sheet (aluminum sheet) from the Sultanate of Oman (Oman), covering the period of review (POR) April 1, 2023, through March 31, 2024. This notice incorrectly listed the company Oman Aluminium Rolling Company SPC under an \"exporter\" header in the rate table section of the notice, when it should have been listed under an \"exporter/producer\" header.", "publication_date": "2026-07-31", "html_url": "https://www.federalregister.gov/documents/2026/07/31/2026-15558/common-alloy-aluminum-sheet-from-the-sultanate-of-oman-amended-final-results-of-antidumping-duty", "pdf_url": "https://www.govinfo.gov/content/pkg/FR-2026-07-31/pdf/2026-15558.pdf", "raw_text_url": "https://www.federalregister.gov/documents/full_text/text/2026/07/31/2026-15558.txt", "first_seen": "2026-11-26T02:07Z", "fulltext_checked": false, "authority": "US"}, {"id  {id:'us-resp',name:'미국피제소',full:'미국 피제소',desc:'세계 각국이 미국산 제품을 조사하는 사건',test:r=>r.tg.includes('US'),krDefault:false,live:false,
  plan:['무역위원회(한국)의 미국산 조사','중국·EU·인도 등의 미국산 조사']},
 {id:'third-file',name:'제3국제소',full:'제3국 제소',desc:'미국·중국 외 국가(EU, 인도, 호주, 캐나다 등)가 조사하는 사건',test:r=>!['US','CN','KR'].includes(r.auth),krDefault:true,live:false,
  plan:['EU 집행위원회 (Official Journal)','인도 DGTR','호주 ADC · 캐나다 CBSA · 브라질 · 튀르키예 등']},
 {id:'third-resp',name:'제3국피제소',full:'제3국 피제소',desc:'미국·중국·한국 외 국가 제품이 조사받는 사건',test:r=>r.tg.includes('OT'),krDefault:false,live:true,
  plan:['현재: 미국 상무부·ITC의 제3국산 조사 자동 분류','예정: 무역위원회(한국)·EU 등의 제3국산 조사']},
];
const GROUPS=[['all','전체'],['new','신규 조사'],['det','예비·최종판정'],['rev','재심'],['etc','기타']];
const grp=r=>r.priority===1?'new':(/판정|명령/.test(r.stage)?'det':(/재심/.test(r.stage)?'rev':'etc'));

$('upd').textContent='업데이트 '+D.built_at;
$('gnb').innerHTML=SECTIONS.map(s=>`<a href="#${s.id}" data-r="${s.id}">${esc(s.name)}</a>`).join('')+`<a class="data" href="#data" data-r="data">DATA</a>`;

const st={q:'',period:60,kr:null};
function card(r){
  return `<article class="it${isW(r)?' w':''}"><div class="meta"><span>${esc(r.publication_date)}</span><span>${esc(r.agency)}</span>
  <span class="tag${r.priority===1?' p1':''}">${esc(r.stage)}</span><span class="tag">${esc(r.remedy)}</span>
  ${r.status==='게재예정'?'<span class="tag pi">게재예정</span>':''}${(r.watch||[]).map(w=>`<span class="tag w">${esc(w)}</span>`).join('')}</div>
  <h3><a href="${esc(r.html_url)}">${esc(r.title)}</a></h3>
  ${r.case_numbers&&r.case_numbers.length?`<p>사건번호 ${esc(r.case_numbers.slice(0,8).join(', '))}${r.case_numbers.length>8?' 외':''}</p>`:''}
  ${r.snippets&&r.snippets.length?`<details><summary>본문 중 한국 관련 언급 ${r.snippets.length}곳</summary><ul>${r.snippets.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`:''}
  ${r.abstract?`<details><summary>요약(원문)</summary><p>${esc(r.abstract)}</p></details>`:''}
  <div class="links">${r.html_url?`<a href="${esc(r.html_url)}">원문</a>`:''}${r.pdf_url?`<a href="${esc(r.pdf_url)}">PDF</a>`:''}</div></article>`;
}
function controls(krOn){
  return `<div class="ctrl"><input type="search" id="q" value="${esc(st.q)}" placeholder="품목·국가·사건번호 검색 (예: nails, A-580)" aria-label="검색">
  <select id="period" aria-label="기간">${[[14,'최근 2주'],[60,'최근 60일'],[365,'최근 1년'],[99999,'전체']].map(([v,l])=>`<option value="${v}"${st.period==v?' selected':''}>${l}</option>`).join('')}</select>
  <label class="tg"><input type="checkbox" id="kr"${krOn?' checked':''}> 한국 관련만</label></div><p class="cline" id="cline" aria-live="polite"></p><div class="list" id="list"></div>`;
}
let shown=50,rowsNow=[];
function fill(base,krOn){
  const q=st.q.trim().toLowerCase();
  rowsNow=base.filter(r=>days(r.publication_date)<=st.period&&(!krOn||isW(r))&&(!q||[r.title,r.product,(r.countries||[]).join(' '),(r.case_numbers||[]).join(' '),r.abstract,(r.snippets||[]).join(' ')].join(' ').toLowerCase().includes(q)));
  const pl={14:'최근 2주',60:'최근 60일',365:'최근 1년',99999:'전체 기간'}[st.period]||'';
  const c=$('cline');if(c)c.innerHTML=`${esc(pl)} · ${krOn?'한국 관련':'모든 국가'}${q?` · "${esc(st.q)}"`:''} <b>${rowsNow.length}건</b>`;
  const L=$('list');if(L){L.style.opacity=.35;setTimeout(()=>L.style.opacity=1,120)}
  shown=50;paint();
}
function paint(){
  const L=$('list');if(!L)return;
  L.innerHTML=rowsNow.length?rowsNow.slice(0,shown).map(card).join('')+(rowsNow.length>shown?`<button class="more" id="more">더보기 (${rowsNow.length-shown}건 남음)</button>`:''):
   '<div class="empty"><p>조건에 맞는 공고가 없어요. "한국 관련만"을 끄거나 기간을 넓혀보세요.</p></div>';
  const m=$('more');if(m)m.addEventListener('click',()=>{shown+=50;paint()});
}
function wire(base,krDefault){
  let kr=st.kr??krDefault;
  const go=()=>fill(base,kr);
  $('q').addEventListener('input',e=>{st.q=e.target.value;go()});
  $('period').addEventListener('change',e=>{st.period=+e.target.value;go()});
  $('kr').addEventListener('change',e=>{kr=e.target.checked;st.kr=kr;go()});
  go();
}
const recent=(base,n)=>base.filter(r=>days(r.publication_date)<=n);

function home(){
  const w14=recent(R.filter(isW),14), n1=w14.filter(r=>r.priority===1).length, pi=R.filter(r=>r.status==='게재예정').length;
  const notice=R.filter(isW).slice(0,6);
  $('app').innerHTML=`<div class="wrap">
  <section class="hero"><div class="hp"><p class="eyebrow">글로벌 무역구제 모니터</p>
   <h1>${n1?`최근 2주, 한국 관련 신규 조사 ${n1}건`:`최근 2주 한국 관련 공고 ${w14.length}건`}</h1>
   <p class="s">흰 바늘이 한국 관련 공고, 점은 신규 조사 개시예요. 최근 60일.</p>
   <div class="fig"><svg id="scale" role="img" aria-label="최근 60일 공고 눈금자"></svg></div></div>
   <aside class="notice"><div class="nt"><b>NOTICE</b><a href="#us-file">더보기 +</a></div>
   ${notice.length?`<ul>${notice.map(r=>`<li><a href="${esc(r.html_url)}" title="${esc(r.title)}">${esc(r.product||r.title)} · ${esc(r.stage)}</a><time>${esc(r.publication_date)}</time></li>`).join('')}</ul>`:'<p class="em">아직 한국 관련 공고가 없어요.</p>'}
   </aside></section>
  <div class="tiles">${SECTIONS.map(s=>{const n=recent(R.filter(s.test),60).length;return `<a class="tile" href="#${s.id}"><h3>${esc(s.name.replace(/(제소|피제소)$/,''))}<span>${esc(s.name.match(/(피제소|제소)$/)[0])}</span><em class="st ${s.live?'live':'soon'}">${s.live?'연결됨':'준비 중'}</em></h3>
    <div class="n">${s.live?n:'–'}<small>${s.live?'최근 60일':''}</small></div><p>${esc(s.desc)}</p></a>`}).join('')}</div></div>
  <section class="kband"><div class="wrap">${[['최근 2주 한국 관련',w14.length],['그중 신규 조사',n1],['게재예정',pi],['누적 수집',R.length]].map(([l,v])=>`<div class="k"><b>${v}</b><span>${l}</span></div>`).join('')}</div></section>
  <div class="wrap"><h2 class="sec">최근 공고</h2>${controls(st.kr??true)}</div>`;
  wire(R,true);
  const s=$('scale');
  const draw=()=>{
    const W=s.clientWidth,H=s.clientHeight,pad=6,span=60,base=H-30,x=d=>pad+(W-2*pad)*(1-d/span);
    let g=`<line x1="${pad}" y1="${base}" x2="${W-pad}" y2="${base}" stroke="#fff" stroke-width="1.5"/>`;
    for(let d=0;d<=span;d++){const big=d%7===0;g+=`<line x1="${x(d)}" y1="${base}" x2="${x(d)}" y2="${base+(big?9:4)}" stroke="#fff" stroke-opacity="${big?.9:.45}"/>`;
      if(big&&(W>520||d%14===0)){const t=new Date(TODAY-d*864e5);g+=`<text x="${x(d)}" y="${base+24}" font-size="12" text-anchor="${d===0?'end':'middle'}" fill="#fff" fill-opacity=".85">${d===0?'오늘':(t.getUTCMonth()+1)+'/'+t.getUTCDate()}</text>`}}
    const stack={};
    R.filter(r=>days(r.publication_date)<=span).forEach(r=>{const d=Math.max(0,days(r.publication_date));stack[d]=(stack[d]||0)+1;const h=Math.min(base-8,(w0=>w0?46:26)(isW(r))+stack[d]*12),w=isW(r);
      g+=`<line x1="${x(d)}" y1="${base}" x2="${x(d)}" y2="${base-h}" stroke="#fff" stroke-opacity="${w?1:.35}" stroke-width="${w?2.5:1.5}"/>`;
      if(w&&r.priority===1)g+=`<circle cx="${x(d)}" cy="${base-h}" r="4.5" fill="#fff"/>`});
    s.innerHTML=g;
  };
  window.__ro&&window.__ro.disconnect();window.__ro=new ResizeObserver(draw);window.__ro.observe(s);
}

function shell(title,lnbTitle,items,crumb,body){
  return `<div class="subvis"><div class="wrap">${esc(title)}</div></div><div class="wrap sub">
  <aside class="lnb"><div class="ttl">${esc(lnbTitle)}</div><ul>${items}</ul></aside>
  <div class="ct"><h2>${esc(crumb[crumb.length-1])}</h2><div class="crumb">Home &gt; ${crumb.slice(0,-1).map(esc).join(' &gt; ')} &gt; <b>${esc(crumb[crumb.length-1])}</b></div>${body}</div></div>`;
}
function section(sec,g){
  const all=R.filter(sec.test), gn=GROUPS.find(x=>x[0]===g)||GROUPS[0];
  const items=GROUPS.map(([k,l])=>`<li><a href="#${sec.id}${k==='all'?'':'-'+k}" class="${k===gn[0]?'on':''}">${l}<span class="cnt">${all.filter(r=>k==='all'||grp(r)===k).length}</span></a></li>`).join('');
  const base=all.filter(r=>gn[0]==='all'||grp(r)===gn[0]);
  const body=sec.live||all.length?`<p class="lead">${esc(sec.desc)}</p><p>${sec.plan.length?esc(sec.plan.join(' · ')):'상무부·ITC 공고를 하루 2회 자동 수집합니다.'}</p>${controls(st.kr??sec.krDefault)}`:
   `<p class="lead">${esc(sec.desc)}</p><div class="empty"><h3>데이터 연결 준비 중</h3><p>다음 단계에서 아래 출처를 연결할 예정이에요.</p><ul>${sec.plan.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`;
  $('app').innerHTML=shell(sec.full,sec.name,items,[sec.name,gn[1]],body);
  if($('list'))wire(base,sec.krDefault);
}
function data(sub){
  const subs=[['kita','KITA 한국 수출입'],['comtrade','UN Comtrade 세계 교역']];
  const cur=subs.find(x=>x[0]===sub)||subs[0];
  const items=subs.map(([k,l])=>`<li><a href="#data-${k}" class="${k===cur[0]?'on':''}">${l}</a></li>`).join('');
  const C={kita:[['품목별 한국 수출입 추이','사건 품목(HS코드)의 국가별 월간 수출입 금액·중량. 관세청 수출입무역통계 API로 연결 예정 (KITA 통계와 같은 통관 원자료).',['사건 HS코드 자동 연결','조사대상기간(POI) 전후 비교','단가(금액÷중량) 추이']],
              ['사건 연동','사건 화면에서 "통계 보기"를 누르면 해당 품목 통계로 이동',['반덤핑 부과 전후 수입 변화','제3국 우회 의심 신호']]],
           comtrade:[['세계 교역 구조','UN Comtrade로 각국의 품목별 수입 상대국 비중을 보여줄 예정',['조사국의 수입 상위 국가','한국 점유율 변화']],
              ['유의 사항','월별 자료는 약 6개월, 연간 자료는 약 18개월 늦게 공개돼요. 최근 동향은 KITA(관세청) 자료를 보세요.',['무료 키: 하루 500회 호출']]]};
  const body=`<p class="lead">무역구제 판단에 필요한 교역 통계</p><p>2단계(관세청)·4단계(UN Comtrade)에서 연결할 예정이에요.</p>
   <div class="dgrid">${C[cur[0]].map(([h,p,l])=>`<div class="dcard"><h3>${esc(h)}<em class="st soon">준비 중</em></h3><p>${esc(p)}</p><ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
  $('app').innerHTML=shell('DATA','DATA',items,['DATA',cur[1]],body);
}
function src(){
  const items=`<li><a class="on" href="#src">데이터 출처</a></li>`;
  const rows=[['미국 상무부·ITC','Federal Register API','연결됨'],['중국 상무부','MOFCOM 무역구제조사국','준비 중'],['한국 무역위원회','ktc.go.kr 공고·월간통계','준비 중'],['EU·인도·기타','각국 관보·조사당국','준비 중'],['한국 수출입 통계','관세청 API (KITA 동일 원자료)','준비 중'],['세계 교역 통계','UN Comtrade API','준비 중']];
  $('app').innerHTML=shell('데이터 출처','안내',items,['안내','데이터 출처'],`<div class="scroll"><table style="width:100%;border-collapse:collapse;margin-top:20px;font-size:15px"><thead><tr>${['구분','출처','상태'].map(h=>`<th style="text-align:left;border-bottom:2px solid var(--ink);padding:8px">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td style="border-bottom:1px solid var(--line);padding:10px 8px;white-space:nowrap">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
}

function route(){
  const h=(location.hash||'#home').slice(1);
  let key='home';
  if(h.startsWith('data')){key='data';data(h.split('-')[1])}
  else if(h==='src'){key='src';src()}
  else{const sec=SECTIONS.find(s=>h===s.id||h.startsWith(s.id+'-'));
    if(sec){key=sec.id;section(sec,h.slice(sec.id.length+1)||'all')}else home()}
  document.querySelectorAll('#gnb a').forEach(a=>a.classList.toggle('on',a.dataset.r===key));
  if(key!=='home')window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
}
</script></body></html>
